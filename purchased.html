<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Købte Varer - Sam's Organizer</title>
  <style>
    :root {
      --bg-image: url('https://lh3.googleusercontent.com/d/1OCMi6ercH1tisFW6oVOidKwVX1rNS_Hn');
      --left-col-ratio: 250.6fr;
      --right-col-ratio: 412.2fr;
      --field-height: 36px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111 var(--bg-image) no-repeat center center fixed;
      background-size: cover; color: #eee; padding: 20px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; background: rgba(0,0,0,0.6); padding: 15px 20px;
      backdrop-filter: blur(8px);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-btn {
      background: #fff; color: #111; padding: 0 16px; height: 32px; border-radius: 0;
      text-decoration: none; font-weight: 600; font-size: 13px; line-height: 1;
      font-family: inherit; cursor: pointer; border: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .nav-btn.btn-add-purchase {
      background: #4287F5; color: #fff;
    }
    .nav-btn.btn-add-purchase:hover {
      background: #3371d4;
    }
    .top-actions-bar {
      display: flex; justify-content: flex-end; margin-bottom: 20px; position: relative; z-index: 50;
    }
    .platform-dropdown-wrap { position: relative; display: inline-block; }
    .platform-toggle-btn {
      background: transparent; border: none; padding: 0; cursor: pointer; display: flex; align-items: center;
    }
    .platform-toggle-btn img { height: 26px; width: auto; object-fit: contain; display: block; }
    .platform-dropdown-panel {
      display: none; position: absolute; top: 100%; right: 0; background: #1a1a1a;
      border: 1px solid #444; padding: 6px; width: max-content;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9); z-index: 999;
      flex-direction: column; gap: 4px;
    }
    .platform-dropdown-panel.show { display: flex; }
    .filter-plat-btn {
      background: transparent; border: none; padding: 0; cursor: pointer;
      height: 26px; display: block; width: auto;
    }
    .filter-plat-btn img { height: 100%; width: auto; display: block; }
    .filter-plat-btn.off img { filter: brightness(35%) grayscale(85%); opacity: 0.6; }
    .grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px;
    }
    @media (max-width: 1450px) { .grid { grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 1250px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 650px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
    .item-card {
      background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); position: relative; border: 1px solid #333;
    }
    .image-container { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; overflow: hidden; }
    .image-container > img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(80%); }
    .corner-edit-btn {
      position: absolute; top: 6px; left: 6px; background: transparent; border: none; padding: 0; cursor: pointer; z-index: 10;
    }
    .corner-edit-btn img { width: 22px; height: 22px; object-fit: contain; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9)); }
    .order-overlay-label {
      position: absolute; bottom: 0; right: 0; background: #000; color: #fff;
      font-size: 9px; font-weight: 800; padding: 3px 7px; text-align: right; z-index: 10;
    }
    .order-overlay-label.is-bundle { left: 0; width: 100%; }
    .platform-banner { width: 100%; background: #fff; display: block; line-height: 0; border-bottom: 1px solid #eee; min-height: 22px; }
    .platform-banner img { width: 100%; height: auto; display: block; }
    .info-box {
      background: #ffffff; color: #222; padding: 8px 10px 10px 10px; font-size: 11px;
      display: flex; flex-direction: column; gap: 6px; flex-grow: 1; justify-content: space-between;
    }
    .info-title {
      font-weight: 700; font-size: 12px; color: #111;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-bottom: 5px; border-bottom: 1px solid #e5e5e5;
    }
    .item-submeta { display: flex; justify-content: space-between; font-size: 10px; color: #555; margin-top: 3px; }
    .date-price-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; margin-top: 4px; }
    .sale-date-text { color: #888; }
    .sale-price-text { color: #111; font-weight: 700; font-size: 11px; }
    .buyer-info-block { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
    .icon-text-row { display: flex; align-items: center; gap: 5px; }
    .icon-text-row img.mini-icon { width: 13px; height: 13px; object-fit: contain; flex-shrink: 0; }
    .buyer-username-text { font-weight: 700; font-size: 11px; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .buyer-name-text { font-weight: 400; font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shipping-route-row {
      display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-top: 3px; width: 100%;
    }
    .shipping-badge-wrap { flex: 1; min-width: 0; text-align: center; font-size: 9.5px; color: #666; }
    .shipping-badge-wrap img { width: 100%; height: auto; display: block; border: 1px solid #696969; }
    .arrow-sep-img { width: 12px; height: 12px; object-fit: contain; flex-shrink: 0; }
    .tracking-row { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 4px; }
    .tracking-btn { background: transparent; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; }
    .tracking-btn img { width: 14px; height: 14px; object-fit: contain; display: block; }
    .tracking-text { font-family: monospace; font-size: 9.5px; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-box-card {
      font-size: 9.5px; color: #555; background: #f4f4f5; padding: 3px 5px; margin-top: 4px;
      border-left: 2px solid #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ============================================================
       MODAL OVERLAY BASE
       ============================================================ */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(5px); z-index: 99999;
      align-items: center; justify-content: center; padding: 10px;
    }
    .modal.show { display: flex; }
    .hidden-date-picker {
      position: absolute; right: 0; top: 0; opacity: 0; pointer-events: none;
      width: 1px; height: 1px; border: 0; padding: 0; visibility: hidden;
    }

    /* ============================================================
       DESKTOP MODAL (> 768px) — BEVARET 100% UÆNDRET
       ============================================================ */
    @media (min-width: 769px) {
      .mobile-only-modal-card { display: none !important; }
      .purchase-modal-card {
        background: #fff; color: #222; width: min(720px, 98vw); max-height: 94vh;
        overflow-y: auto; padding: 16px 20px; box-shadow: 0 12px 35px rgba(0,0,0,0.8);
        display: flex; flex-direction: column; gap: 12px;
      }
      .purchase-modal-header {
        display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid #ddd; padding-bottom: 8px;
      }
      .purchase-modal-header h2 { font-size: 16px; font-weight: 700; color: #111; }
      .add-more-btn { background: #0062FF; color: #fff; border: none; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
      .add-more-btn:hover { background: #004ecc; }
      .purchase-grid-section {
        display: grid; grid-template-columns: var(--left-col-ratio) var(--right-col-ratio);
        column-gap: 32px; row-gap: 10px; width: 100%; align-items: start;
      }
      .item-image-square {
        position: relative; width: 100%; aspect-ratio: 1 / 1; background: #f8f9fa;
        border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; overflow: hidden;
      }
      .item-image-square img.preview-img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .img-edit-btn { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.75); color: #fff; border: none; font-size: 9px; padding: 2px 6px; cursor: pointer; z-index: 10; }
      .item-counter-pill { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.75); color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; z-index: 10; }
      .item-delete-pill { position: absolute; bottom: 4px; right: 4px; background: #dc2626; color: #fff; border: none; font-size: 9px; padding: 2px 6px; cursor: pointer; z-index: 10; }
      .img-nav-arrow {
        position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.9);
        border: 1px solid #ccc; color: #111; width: 24px; height: 32px; font-size: 13px; font-weight: bold; cursor: pointer;
        display: flex; align-items: center; justify-content: center; z-index: 10;
      }
      .img-nav-prev { left: 0; }
      .img-nav-next { right: 0; }
      .img-nav-arrow.hidden { display: none; }
      .item-details-stack { display: flex; flex-direction: column; gap: 8px; width: 100%; }
      .three-col-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
      .form-group { display: flex; flex-direction: column; gap: 3px; width: 100%; }
      .form-group label { font-size: 11px; font-weight: 600; color: #333; }
      .form-group input { height: var(--field-height); padding: 4px 8px; border: 1px solid #ccc; font-size: 12px; background: #fff; color: #111; width: 100%; }
      .form-group input:focus { outline: none; border-color: #0062FF; }
      .date-input-wrap { position: relative; display: flex; align-items: center; width: 100%; }
      .date-input-wrap input { padding-right: 28px; }
      .calendar-icon-btn {
        position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: transparent; border: none;
        cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; z-index: 5;
      }
      .calendar-icon-btn img { width: 14px; height: 14px; object-fit: contain; }
      .menu-dd { position: relative; display: block; width: 100%; }
      .menu-dd-btn {
        position: relative; height: var(--field-height); width: 100%; display: flex; align-items: center; cursor: pointer; border: 1px solid #ccc; background: #fff; padding: 0; overflow: hidden;
      }
      .menu-dd-btn img.menu-img { height: var(--field-height); width: 100%; object-fit: fill; display: block; }
      .menu-dd-btn img.menu-toggle-icon {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%); height: 14px; width: 14px; object-fit: contain; pointer-events: none; z-index: 10;
      }
      .menu-dd-list {
        display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #fff; border: 1px solid #999; border-top: none; max-height: 180px; overflow-y: auto; z-index: 1000; box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      }
      .menu-dd-list.open { display: block; }
      .menu-dd-opt { height: var(--field-height); width: 100%; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #eee; background: #fff; padding: 0; overflow: hidden; }
      .menu-dd-opt:hover { filter: brightness(0.92); }
      .menu-dd-opt img.menu-img { height: var(--field-height); width: 100%; object-fit: fill; display: block; }
      .purchase-modal-footer {
        display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 4px; border-top: 1px solid #ddd; padding-top: 10px;
      }
      .footer-btn { height: 30px; padding: 0 14px; font-size: 11.5px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
      .btn-cancel { background: #e2e8f0; color: #111; }
      .btn-cancel:hover { background: #cbd5e1; }
      .btn-save { background: #28a745; color: #fff; }
      .btn-save:hover { background: #218838; }
      .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
    }

    /* ============================================================
       MOBILE MODAL (<= 768px) — 1:1 MOCKUP SPEC [382 x 745 px]
       ============================================================ */
    @media (max-width: 768px) {
      .purchase-modal-card { display: none !important; }
      #purchaseModal { padding: 0; overflow-y: auto; }

      .mobile-only-modal-card {
        position: relative;
        width: 382px;
        height: 745px;
        padding: 20px;
        background: #ffffff;
        color: #111111;
        box-shadow: 0 12px 35px rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow: visible;
      }

      /* Bundle navigation arrows i de 20px venstre/højre padding */
      .mob-bundle-arrow {
        position: absolute;
        top: 230px;
        width: 20px;
        height: 64px;
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .mob-bundle-arrow img {
        width: 14px;
        height: auto;
        object-fit: contain;
        display: block;
      }
      .mob-bundle-arrow.left { left: 0; }
      .mob-bundle-arrow.right { right: 0; }
      .mob-bundle-arrow.hidden { display: none; }
      .mob-bundle-arrow.disabled { opacity: 0.35; pointer-events: none; }

      /* Header: 342 x 25 px */
      .mob-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 342px;
        height: 25px;
        margin-bottom: 15px;
        flex-shrink: 0;
      }
      .mob-modal-title {
        font-size: 20px;
        font-weight: 700;
        color: #111;
        line-height: 25px;
        height: 25px;
        display: flex;
        align-items: center;
      }
      .mob-add-more-btn {
        height: 25px;
        padding: 0 9px;
        background: #146ef5;
        color: #fff;
        border: none;
        font-size: 10.5px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      /* Top blok: Billede (180x233) + 32px gap + Højre stack (130px) = 342px */
      .mob-top-row {
        display: flex;
        width: 342px;
        height: 233px;
        align-items: flex-start;
        flex-shrink: 0;
      }
      .mob-img-box {
        position: relative;
        width: 180px;
        height: 233px;
        background: #f4f4f5;
        border: 1px solid #cccccc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
      }
      .mob-img-box img.mob-preview-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .mob-img-edit-btn {
        position: absolute;
        top: 6px;
        left: 6px;
        background: #444;
        color: #fff;
        border: none;
        font-size: 9px;
        font-weight: 600;
        padding: 2px 6px;
        cursor: pointer;
        z-index: 5;
      }
      .mob-img-counter {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0,0,0,0.75);
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        padding: 2px 5px;
        z-index: 5;
      }
      .mob-img-del-btn {
        position: absolute;
        bottom: 6px;
        right: 6px;
        background: #dc2626;
        color: #fff;
        border: none;
        font-size: 9px;
        padding: 2px 5px;
        cursor: pointer;
        z-index: 5;
      }

      .mob-right-fields {
        width: 130px;
        margin-left: 32px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      /* Standard label (10px højde fra baseline og op) + 5px margin ned */
      .mob-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #222;
        line-height: 10px;
        height: 10px;
        margin-bottom: 5px;
        white-space: nowrap;
      }

      .mob-input {
        height: 32px;
        padding: 0 7px;
        border: 1px solid #cccccc;
        background: #ffffff;
        color: #111111;
        font-size: 11.5px;
        font-family: inherit;
        outline: none;
      }
      .mob-input:focus {
        border-color: #146ef5;
      }
      .mob-input-locked {
        background: #ebebed;
        border: 1px solid #9a9aa0;
        font-weight: 700;
        color: #111;
      }

      /* Midtersektion under billede: venstre kolonne (180px) + 32px margin + Bemærkning (130px) */
      .mob-mid-row {
        display: flex;
        width: 342px;
        margin-top: 15px;
        align-items: flex-start;
        flex-shrink: 0;
      }
      .mob-mid-left {
        width: 180px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .mob-date-status-row {
        display: flex;
        align-items: flex-start;
        margin-top: 20px;
        width: 180px;
      }
      .mob-date-col {
        width: 110px;
        flex-shrink: 0;
      }
      .mob-date-wrap {
        position: relative;
        width: 110px;
        height: 32px;
      }
      .mob-date-wrap input {
        width: 110px;
        height: 32px;
        padding: 0 26px 0 6px;
        font-size: 11px;
      }
      .mob-cal-btn {
        position: absolute;
        right: 5px;
        top: 7px;
        width: 18px;
        height: 18px;
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mob-cal-btn img {
        width: 18px;
        height: 18px;
        object-fit: contain;
        display: block;
      }

      .mob-status-col {
        width: 60px;
        margin-left: 9.5px;
        flex-shrink: 0;
      }
      .mob-status-btn {
        width: 60px;
        height: 32px;
        border: 1px solid #cccccc;
        background: #ffffff;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .mob-status-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .mob-mid-right {
        width: 130px;
        margin-left: 32px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .mob-textarea {
        width: 130px;
        height: 99px;
        padding: 6px 7px;
        border: 1px solid #cccccc;
        background: #ffffff;
        color: #111111;
        font-size: 11.5px;
        font-family: inherit;
        resize: none;
        outline: none;
      }
      .mob-textarea:focus {
        border-color: #146ef5;
      }

      /* Stiplet trappelignende skillelinje:
         1) Vandret over 'Købsdato' og 'Status' (midt i den 20px margin under Varens titel: y = 365px)
         2) Lodret ned midt i den 32px brede margin ved siden af Status (x = 216px, fra y = 365px til 432px)
         3) Vandret hen over 'Ordre total' (midt i den 20px margin under Status/Bemærkning: y = 432px) */
      .mob-dashed-top {
        position: absolute;
        left: 20px;
        top: 365px;
        width: 196px;
        height: 0;
        border-top: 1px dashed #333333;
        pointer-events: none;
        z-index: 4;
      }
      .mob-dashed-vert {
        position: absolute;
        left: 216px;
        top: 365px;
        width: 0;
        height: 67px;
        border-left: 1px dashed #333333;
        pointer-events: none;
        z-index: 4;
      }
      .mob-dashed-bot {
        position: absolute;
        left: 216px;
        top: 432px;
        width: 146px;
        height: 0;
        border-top: 1px dashed #333333;
        pointer-events: none;
        z-index: 4;
      }

      /* Økonomi-række: Gebyr (95) + 12px + Fragtpris (95) + 30px (med '=' tegn) + Ordre total (110) = 342px */
      .mob-money-row {
        display: flex;
        align-items: flex-end;
        width: 342px;
        margin-top: 20px;
        flex-shrink: 0;
      }
      .mob-equals-sep {
        width: 30px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 800;
        color: #111;
        flex-shrink: 0;
      }

      /* Nederste 2 kolonner med 30px midter-margin: 140px + 30px + 172px = 342px */
      .mob-bottom-cols {
        display: flex;
        width: 342px;
        margin-top: 15px;
        align-items: flex-start;
        flex-shrink: 0;
      }
      .mob-col-left {
        width: 140px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex-shrink: 0;
      }
      .mob-col-mid {
        width: 30px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex-shrink: 0;
      }
      .mob-mid-icon-slot {
        width: 30px;
        height: 32px;
        margin-top: 15px; /* Matcher 10px label + 5px margin */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mob-mid-icon-slot img {
        width: 17px;
        height: 17px;
        object-fit: contain;
        display: block;
      }
      .mob-col-right {
        width: 172px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex-shrink: 0;
      }

      /* Opadgående Drop-ups (140 x 32 px) uden max-height / scroll */
      .mob-dd {
        position: relative;
        width: 140px;
        height: 32px;
      }
      .mob-dd-btn {
        position: relative;
        width: 140px;
        height: 32px;
        border: 1px solid #cccccc;
        background: #ffffff;
        cursor: pointer;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .mob-dd-btn img.mob-dd-img {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;

    function normalizeDateInput(input) {
      let val = input.value.trim();
      if (!val) return;
      val = val.replace(/[-.]/g, '/');
      if (/^\d{8}$/.test(val)) val = `${val.slice(0,2)}/${val.slice(2,4)}/${val.slice(4)}`;
      let parts = val.split('/');
      if (parts.length === 3) {
        let d = parts[0].padStart(2, '0');
        let m = parts[1].padStart(2, '0');
        let y = parts[2];
        if (y.length === 2) y = '20' + y;
        input.value = `${d}/${m}/${y}`;
      }
    }

    function formatDanishDate(raw) {
      if (!raw) return "";
      let str = String(raw).trim();
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return str;
      let d = new Date(str);
      if (!isNaN(d.getTime())) return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
      return str;
    }

    function parseDateToTimestamp(raw) {
      if (!raw) return 0;
      let str = String(raw).trim();
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
        let parts = str.split('/');
        let d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
        return isNaN(d.getTime()) ? 0 : d.getTime();
      }
      let d = new Date(str);
      return isNaN(d.getTime()) ? 0 : d.getTime();
    }

    function parseDanishNumber(raw) {
      if (raw === null || raw === undefined || raw === "") return 0;
      let cleaned = String(raw).replace(/kr\.?/gi, "").trim();
      if (cleaned.includes(",") && cleaned.includes(".")) cleaned = cleaned.replace(/\./g, "").replace(",", ".");
      else if (cleaned.includes(",")) cleaned = cleaned.replace(",", ".");
      let num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    }

    function formatDanishPrice(raw) {
      let num = parseDanishNumber(raw);
      return `${num.toFixed(2).replace(".", ",")} kr.`;
    }

    function renderPurchasedGrid(items) {
      const container = document.getElementById('purchasedContainer');
      if (!items || items.length === 0) {
        container.innerHTML = '<p>Ingen købte varer fundet.</p>';
        return;
      }

      const orderCounts = {};
      items.forEach(i => { if (i.id) orderCounts[i.id] = (orderCounts[i.id] || 0) + 1; });

      const orderGroups = {};
      items.forEach(i => {
        if (!orderGroups[i.id]) orderGroups[i.id] = [];
        orderGroups[i.id].push(i);
      });

      const sorted = items.slice().sort((a, b) => {
        const timeA = parseDateToTimestamp(a.purchase_date);
        const timeB = parseDateToTimestamp(b.purchase_date);
        if (timeB !== timeA) {
          return timeB - timeA;
        }
        return Number(b.id || 0) - Number(a.id || 0);
      });

      const bundleColorMap = {};
      let colorIdx = 0;
      sorted.forEach(i => {
        if (orderCounts[i.id] > 1 && !bundleColorMap[i.id]) {
          bundleColorMap[i.id] = BUNDLE_COLORS[colorIdx % BUNDLE_COLORS.length];
          colorIdx++;
        }
      });

      const visibleItems = sorted.filter(item => {
        const plat = String(item.platform || '').trim().toLowerCase();
        return !plat || activePlatformFilters.has(plat);
      });

      if (visibleItems.length === 0) {
        container.innerHTML = '<p>Ingen varer matcher de valgte platforme.</p>';
        return;
      }

      container.innerHTML = visibleItems.map((item) => {
        const isBundle = orderCounts[item.id] > 1;
        const platObj = PLATFORM_OPTIONS.find(p => p.value.toLowerCase() === String(item.platform || '').trim().toLowerCase());
        const shipObj = SHIPPING_OPTIONS.find(c => c.value.toLowerCase() === String(item.shipping || '').trim().toLowerCase());
        const origObj = ORIGIN_OPTIONS.find(d => d.value.toLowerCase() === String(item.origin || '').trim().toLowerCase());
        const userIconId = platObj ? platObj.userIcon : DEFAULT_USER_ICON_ID;

        let displayTotalStr = "";
        if (item.item_total !== undefined && String(item.item_total).trim() !== "") {
          displayTotalStr = formatDanishPrice(item.item_total);
        } else {
          const orderSiblings = orderGroups[item.id] || [item];
          let sumItemPrices = 0;
          orderSiblings.forEach(s => { sumItemPrices += parseDanishNumber(s.item_price); });
          const shipping = parseDanishNumber(item.shipping_price);
          const fee = parseDanishNumber(item.fee);
          const p = parseDanishNumber(item.item_price);
          let calcTotal = p;
          if (sumItemPrices > 0) {
            calcTotal = p + ((p / sumItemPrices) * fee) + (shipping / orderSiblings.length);
          } else if (orderSiblings.length > 0) {
            calcTotal = p + (fee / orderSiblings.length) + (shipping / orderSiblings.length);
          }
          displayTotalStr = formatDanishPrice(calcTotal);
        }

        return `
          <div class="item-card">
            <div class="image-container">
              <button class="corner-edit-btn" title="Rediger køb" onclick="openEditPurchaseModal('${item.id}', '${item.titel ? item.titel.replace(/'/g, "\\'") : ''}')">
                <img src="${gImg(EDIT_BUTTON_ID)}" alt="Rediger">
              </button>
              ${item.image_id ? `<img src="${gImg(item.image_id)}" alt="">` : '<div style="color:#777; text-align:center; padding-top:100px;">Mangler</div>'}
              <div class="order-overlay-label ${isBundle ? 'is-bundle' : ''}" style="${isBundle ? `background:${bundleColorMap[item.id]};` : ''}">
                KØB #${item.id}
              </div>
            </div>

            <div class="platform-banner">
              ${platObj ? `<img src="${gImg(platObj.bannerId)}" alt="${platObj.value}">` : ''}
            </div>

            <div class="info-box">
              <div>
                <div class="info-title">${item.titel || ''}</div>
                <div class="item-submeta">
                  <span>${item.brand || '-'}</span>
                  <span>Str. ${item.size || '-'}</span>
                </div>
                <div class="date-price-row">
                  <span class="sale-date-text">${formatDanishDate(item.purchase_date)}</span>
                  <span class="sale-price-text">${displayTotalStr}</span>
                </div>
                <div class="buyer-info-block">
                  <div class="icon-text-row">
                    <img class="mini-icon" src="${gImg(userIconId)}" alt="">
                    <span class="buyer-username-text">${item.seller_username || '-'}</span>
                  </div>
                  <div class="icon-text-row">
                    <img class="mini-icon" src="https://lh3.googleusercontent.com/d/1re723daIGL0sxmLhcuxDMR20ZM7-gCWY" alt="">
                    <span class="buyer-name-text">${item.seller_name || '-'}</span>
                  </div>
                </div>
                ${item.note ? `<div class="note-box-card" title="${item.note}">${item.note}</div>` : ''}
              </div>

              <div>
                <div class="shipping-route-row">
                  <div class="shipping-badge-wrap">
                    ${origObj ? `<img src="${gImg(origObj.iconId)}" alt="">` : `<span>${item.origin || '-'}</span>`}
                  </div>
                  <img class="arrow-sep-img" src="${gImg(ARROW_ICON_ID)}" alt="">
                  <div class="shipping-badge-wrap">
                    ${shipObj ? `<img src="${gImg(shipObj.iconId)}" alt="">` : `<span>${item.shipping || '-'}</span>`}
                  </div>
                </div>
                <div class="tracking-row">
                  <button class="tracking-btn"><img src="${gImg(TRACKING_ICON_ID)}" alt=""></button>
                  <span class="tracking-text">${item.tracking || '-'}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

      const imgEl = document.getElementById('itemPreviewImg');
      const txtEl = document.getElementById('itemNoImgText');
      const mobImgEl = document.getElementById('mobItemPreviewImg');
      const mobTxtEl = document.getElementById('mobItemNoImgText');

      if (item.previewUrl) {
        imgEl.src = item.previewUrl;
        imgEl.style.display = 'block';
        txtEl.style.display = 'none';
        mobImgEl.src = item.previewUrl;
        mobImgEl.style.display = 'block';
        mobTxtEl.style.display = 'none';
      } else {
        imgEl.src = "";
        imgEl.style.display = 'none';
        txtEl.style.display = 'block';
        mobImgEl.src = "";
        mobImgEl.style.display = 'none';
        mobTxtEl.style.display = 'block';
      }

      const totalItems = orderItemsList.length;
      const badge = document.getElementById('itemCounterBadge');
      const delBtn = document.getElementById('removeCurrentItemBtn');
      const prevArrow = document.getElementById('prevItemArrow');
      const nextArrow = document.getElementById('nextItemArrow');

      const mobBadge = document.getElementById('mobItemCounterBadge');
      const mobDelBtn = document.getElementById('mobRemoveCurrentItemBtn');
      const mobPrevArrow = document.getElementById('mobPrevItemArrow');
      const mobNextArrow = document.getElementById('mobNextItemArrow');

      if (totalItems > 1) {
        badge.style.display = 'block';
        badge.innerText = `${currentItemIdx + 1} / ${totalItems}`;
        delBtn.style.display = 'block';
        prevArrow.classList.remove('hidden');
        nextArrow.classList.remove('hidden');
        prevArrow.style.opacity = currentItemIdx === 0 ? '0.35' : '1';
        nextArrow.style.opacity = currentItemIdx === totalItems - 1 ? '0.35' : '1';

        mobBadge.style.display = 'block';
        mobBadge.innerText = `${currentItemIdx + 1} / ${totalItems}`;
        mobDelBtn.style.display = 'block';
        mobPrevArrow.classList.remove('hidden');
        mobNextArrow.classList.remove('hidden');
        mobPrevArrow.classList.toggle('disabled', currentItemIdx === 0);
        mobNextArrow.classList.toggle('disabled', currentItemIdx === totalItems - 1);
      } else {
        badge.style.display = 'none';
        delBtn.style.display = 'none';
        prevArrow.classList.add('hidden');
        nextArrow.classList.add('hidden');

        mobBadge.style.display = 'none';
        mobDelBtn.style.display = 'none';
        mobPrevArrow.classList.add('hidden');
        mobNextArrow.classList.add('hidden');
      }
      
      recalculateOrderTotal();
    }

    function syncCurrentItemField(field, val) {
      orderItemsList[currentItemIdx][field] = val;
      if (field === 'titel') {
        document.getElementById('inItemTitle').value = val;
        document.getElementById('mobInItemTitle').value = val;
      } else if (field === 'item_price') {
        document.getElementById('inItemPrice').value = val;
        document.getElementById('mobInItemPrice').value = val;
      } else if (field === 'size') {
        document.getElementById('inItemSize').value = val;
        document.getElementById('mobInItemSize').value = val;
      } else if (field === 'note') {
        document.getElementById('inItemNote').value = val;
        document.getElementById('mobInItemNote').value = val;
      }
    }

    function handleItemImageSelected(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      compressImageFile(file, 1200, 0.82).then((dataUrl) => {
        orderItemsList[currentItemIdx].imageBase64 = dataUrl;
        orderItemsList[currentItemIdx].previewUrl = dataUrl;
        loadItemIntoFields();
      }).catch(() => {
        const reader = new FileReader();
        reader.onload = () => {
          orderItemsList[currentItemIdx].imageBase64 = reader.result;
          orderItemsList[currentItemIdx].previewUrl = reader.result;
          loadItemIntoFields();
        };
        reader.readAsDataURL(file);
      });
    }

    function compressImageFile(file, maxDim, quality) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) { reject(new Error('Not image')); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            const scale = Math.min(1, maxDim / Math.max(w, h));
            w = Math.round(w * scale); h = Math.round(h * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            let outType = 'image/jpeg';
            if (file.type === 'image/png' && quality >= 0.9) outType = 'image/png';
            resolve(canvas.toDataURL(outType, quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function formatPriceInput(input, fieldName) {
      if (!input.value.trim()) {
        syncCurrentItemField(fieldName, "");
        recalculateOrderTotal();
        return;
      }
      const formatted = formatDanishPrice(input.value);
      input.value = formatted;
      syncCurrentItemField(fieldName, formatted);
      recalculateOrderTotal();
    }

    function formatSharedPriceInput(input) {
      if (!input.value.trim()) return;
      input.value = formatDanishPrice(input.value);
      recalculateOrderTotal();
    }

    function recalculateOrderTotal() {
      let sumItemPrices = 0;
      orderItemsList.forEach(item => {
        sumItemPrices += parseDanishNumber(item.item_price);
      });
      const shipping = parseDanishNumber(document.getElementById('inShippingPrice').value);
      const fee = parseDanishNumber(document.getElementById('inFeePrice').value);
      const totalOrder = sumItemPrices + shipping + fee;
      const formattedOrderTotal = `${totalOrder.toFixed(2).replace(".", ",")} kr.`;

      document.getElementById('inOrderTotal').value = `= ${formattedOrderTotal}`;
      document.getElementById('mobInOrderTotal').value = formattedOrderTotal;

      orderItemsList.forEach(item => {
        let p = parseDanishNumber(item.item_price);
        let calcTotal = p;
        if (sumItemPrices > 0) {
          calcTotal = p + ((p / sumItemPrices) * fee) + (shipping / orderItemsList.length);
        } else if (orderItemsList.length > 0) {
          calcTotal = p + (fee / orderItemsList.length) + (shipping / orderItemsList.length);
        }
        item.item_total = `${calcTotal.toFixed(2).replace(".", ",")} kr.`;
      });

      const currentItemTotalStr = orderItemsList[currentItemIdx].item_total;
      document.getElementById('inItemTotalDisplay').value = `= ${currentItemTotalStr}`;
      document.getElementById('mobInItemTotalDisplay').value = `= ${currentItemTotalStr}`;
    }

    /* DESKTOP DROPDOWN */
    function renderDropdown(containerId, key, options, selectedVal) {
      const container = document.getElementById(containerId);
      const selObj = (selectedVal && selectedVal.trim() !== "") ? options.find(o => o.value.toLowerCase() === String(selectedVal).trim().toLowerCase()) : null;
      modalDropdownState[key] = selObj ? selObj.value : "";

      container.innerHTML = `
        <div class="menu-dd-btn" onclick="toggleMenuDropdown(event, '${containerId}')">
          ${selObj ? `<img class="menu-img" src="${gImg(selObj.menuId)}" alt="${selObj.value}">` : ''}
          <img class="menu-toggle-icon" src="${gImg(OPEN_MENU_ID)}" alt="">
        </div>
        <div class="menu-dd-list">
          <div class="menu-dd-opt" onclick="selectMenuDropdown('${containerId}', '${key}', '')"></div>
          ${options.map(opt => `
            <div class="menu-dd-opt" onclick="selectMenuDropdown('${containerId}', '${key}', '${opt.value}')">
              <img class="menu-img" src="${gImg(opt.menuId)}" alt="${opt.value}">
            </div>
          `).join('')}
        </div>
      `;
    }

    function toggleMenuDropdown(e, containerId) {
      e.stopPropagation();
      document.querySelectorAll('.menu-dd-list').forEach(l => {
        if (l.parentElement.id !== containerId) {
          l.classList.remove('open');
          const ic = l.parentElement.querySelector('.menu-toggle-icon');
          if (ic) ic.src = gImg(OPEN_MENU_ID);
        }
      });
      const list = document.querySelector(`#${containerId} .menu-dd-list`);
      const icon = document.querySelector(`#${containerId} .menu-toggle-icon`);
      list.classList.toggle('open');
      if (icon) icon.src = list.classList.contains('open') ? gImg(CLOSE_MENU_ID) : gImg(OPEN_MENU_ID);
    }

    function selectMenuDropdown(containerId, key, val) {
      modalDropdownState[key] = val;
      const map = { platform: PLATFORM_OPTIONS, origin: ORIGIN_OPTIONS, shipping: SHIPPING_OPTIONS };
      const mobMap = { platform: 'dd_mob_platform', origin: 'dd_mob_origin', shipping: 'dd_mob_shipping' };
      renderDropdown(containerId, key, map[key], val);
      renderMobileDropdown(mobMap[key], key, map[key], val);
    }

    /* MOBILE DROPUP */
    function renderMobileDropdown(containerId, key, options, selectedVal) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const selObj = (selectedVal && selectedVal.trim() !== "") ? options.find(o => o.value.toLowerCase() === String(selectedVal).trim().toLowerCase()) : null;
      modalDropdownState[key] = selObj ? selObj.value : "";

      if (key === 'platform') {
        const iconEl = document.getElementById('mobPlatformUserIcon');
        if (iconEl) {
          iconEl.src = gImg(selObj && selObj.mobUserIcon ? selObj.mobUserIcon : MOB_DEFAULT_USER_ICON_ID);
        }
      }

      const activeBtnImg = selObj ? selObj.mobMenuId : MOB_DEFAULT_MENU_ID;

      container.innerHTML = `
        <div class="mob-dd-btn" onclick="toggleMobileDropdown(event, '${containerId}')">
          <img class="mob-dd-img" src="${gImg(activeBtnImg)}" alt="${selObj ? selObj.value : 'Default'}">
          <img class="mob-dd-toggle" src="${gImg(MOB_OPEN_MENU_ID)}" alt="">
        </div>
        <div class="mob-dd-list">
          <div class="mob-dd-opt" onclick="selectMobileDropdown('${containerId}', '${key}', '')">
            <img class="mob-dd-img" src="${gImg(MOB_DEFAULT_MENU_ID)}" alt="Default">
          </div>
          ${options.map(opt => `
            <div class="mob-dd-opt" onclick="selectMobileDropdown('${containerId}', '${key}', '${opt.value}')">
              <img class="mob-dd-img" src="${gImg(opt.mobMenuId)}" alt="${opt.value}">
            </div>
          `).join('')}
        </div>
      `;
    }

    function toggleMobileDropdown(e, containerId) {
      e.stopPropagation();
      document.querySelectorAll('.mob-dd-list').forEach(l => {
        if (l.parentElement.id !== containerId) {
          l.classList.remove('open');
          const ic = l.parentElement.querySelector('.mob-dd-toggle');
          if (ic) ic.src = gImg(MOB_OPEN_MENU_ID);
        }
      });
      const list = document.querySelector(`#${containerId} .mob-dd-list`);
      const icon = document.querySelector(`#${containerId} .mob-dd-toggle`);
      list.classList.toggle('open');
      if (icon) icon.src = list.classList.contains('open') ? gImg(MOB_CLOSE_MENU_ID) : gImg(MOB_OPEN_MENU_ID);
    }

    function selectMobileDropdown(containerId, key, val) {
      modalDropdownState[key] = val;
      const map = { platform: PLATFORM_OPTIONS, origin: ORIGIN_OPTIONS, shipping: SHIPPING_OPTIONS };
      const deskMap = { platform: 'dd_pur_platform', origin: 'dd_pur_origin', shipping: 'dd_pur_shipping' };
      renderMobileDropdown(containerId, key, map[key], val);
      renderDropdown(deskMap[key], key, map[key], val);
    }

    async function handlePurchaseSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('purchaseSubmitBtn');
      const mobBtn = document.getElementById('mobPurchaseSubmitBtn');
      if ((btn && btn.disabled) || (mobBtn && mobBtn.disabled)) return;

      if (btn) { btn.disabled = true; btn.innerText = 'Gemmer...'; }
      if (mobBtn) { mobBtn.disabled = true; mobBtn.innerText = 'Gemmer...'; }

      recalculateOrderTotal();

      const sharedData = {
        purchase_date: formatDanishDate(document.getElementById('inOrderDate').value),
        platform: modalDropdownState.platform || "",
        seller_username: document.getElementById('inSellerUsername').value,
        origin: modalDropdownState.origin || "",
        seller_name: document.getElementById('inSellerName').value,
        shipping: modalDropdownState.shipping || "",
        shipping_price: formatDanishPrice(document.getElementById('inShippingPrice').value),
        tracking: document.getElementById('inTracking').value,
        fee: formatDanishPrice(document.getElementById('inFeePrice').value),
        status: PURCHASE_STATUS_OPTIONS[currentPurchaseStatusIdx].value
      };

      const itemsPayload = orderItemsList.map(i => ({
        rowIndex: i.rowIndex,
        titel: i.titel,
        item_price: formatDanishPrice(i.item_price),
        item_total: formatDanishPrice(i.item_total),
        brand: i.brand,
        size: i.size,
        note: i.note,
        image_id: i.image_id || "",
        imageBase64: i.imageBase64 || ""
      }));

      const payload = {
        action: isEditingExistingOrder ? "updatePurchaseOrder" : "addPurchaseOrder",
        order_id: editingOrderId,
        shared: sharedData,
        items: itemsPayload
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const txt = await res.text();
        let result = null;
        try { result = JSON.parse(txt); } catch (parseErr) { throw new Error('Ugyldigt svar fra server: ' + txt.slice(0, 200)); }
        if (!result || result.status !== 'success') {
          throw new Error((result && result.message) || 'Serveren returnerede fejl');
        }
        if (result.image_ids) {
          result.image_ids.forEach((id, idx) => {
            if (id && orderItemsList[idx]) {
              orderItemsList[idx].image_id = id;
              orderItemsList[idx].imageBase64 = "";
            }
          });
        }
        closePurchaseModal();
        await loadPurchasedItems();
      } catch (err) {
        alert("Fejl ved gem: " + err.message + "\n\nHvis billedet er meget stort, prøv med mindre billede. Prøv igen.");
      } finally {
        if (btn) { btn.disabled = false; btn.innerText = 'Gem ordre'; }
        if (mobBtn) { mobBtn.disabled = false; mobBtn.innerText = 'Gem ordre'; }
      }
    }

    window.onload = loadPurchasedItems;
  </script>
