<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Aktive Varer - Sam's Organizer</title>
  <style>
    :root {
      --bg-image: url('https://lh3.googleusercontent.com/d/1OCMi6ercH1tisFW6oVOidKwVX1rNS_Hn');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111 var(--bg-image) no-repeat center center fixed;
      background-size: cover; color: #eee; padding: 20px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; background: rgba(0,0,0,0.6); padding: 15px 20px;
      backdrop-filter: blur(8px);
    }
    .nav-btn {
      background: #fff; color: #111; padding: 8px 16px; border-radius: 0;
      text-decoration: none; font-weight: 600; font-size: 13px; margin-left: 10px;
      cursor: pointer; border: none; display: inline-block;
    }
    .controls-bar {
      display: flex; gap: 10px; margin-bottom: 20px; align-items: center;
    }
    .controls-bar input {
      padding: 10px; background: rgba(0,0,0,0.7); border: 1px solid #444; color: #fff; font-size: 13px; flex-grow: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }
    @media (min-width: 1200px) { .grid { grid-template-columns: repeat(6, 1fr); } }
    @media (min-width: 1400px) { .grid { grid-template-columns: repeat(7, 1fr); } }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 650px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

    .item-card {
      background: #1a1a1a; border-radius: 0 !important; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      position: relative; border: 1px solid #333;
    }
    .image-container {
      position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000;
    }
    .image-container > img {
      width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(80%);
    }
    .sold-corner-btn {
      position: absolute; top: 6px; left: 6px; background: transparent; border: none; padding: 0; cursor: pointer; z-index: 10;
    }
    .sold-corner-btn img {
      width: 28px; height: 28px; object-fit: contain; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
    }
    .edit-corner-btn {
      position: absolute; top: 6px; right: 6px; background: transparent; border: none; padding: 0; cursor: pointer; z-index: 10;
    }
    .edit-corner-btn img {
      width: 22px; height: 22px; object-fit: contain; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
    }
    .size-badge {
      position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.75); color: #fff;
      font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 0;
    }
    .info-box {
      background: #fff; color: #111; padding: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .info-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-brand { color: #666; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* MODAL */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 99999;
      align-items: center; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: #fff; color: #222; padding: 20px; border-radius: 0;
      width: 95%; max-width: 720px; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
    }
    .modal-card h3 { font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }

    .bundle-picker-container {
      display: grid; grid-template-columns: 210px 1fr; gap: 12px;
      background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; max-height: 280px;
    }
    .picker-categories {
      border-right: 1px solid #ddd; padding-right: 8px; overflow-y: auto; max-height: 250px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .cat-item { font-size: 11px; font-weight: 600; padding: 5px 8px; cursor: pointer; color: #333; }
    .cat-item:hover { background: #e2e8f0; }
    .subcat-list { padding-left: 10px; display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
    .subcat-item { font-size: 10.5px; padding: 3px 6px; cursor: pointer; color: #555; }
    .subcat-item:hover, .subcat-item.active { background: #cbd5e1; color: #000; font-weight: 700; }

    .picker-items-grid { overflow-y: auto; max-height: 250px; display: flex; flex-direction: column; gap: 5px; padding-right: 4px; }
    .picker-item-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #ccc; padding: 5px 8px; cursor: pointer; }
    .picker-item-row:hover { background: #f1f5f9; }
    .picker-item-row.selected { border-color: #0062FF; background: #eff6ff; }
    .picker-item-info { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .picker-item-info img { width: 32px; height: 42px; object-fit: cover; background: #000; }

    .selected-bundle-strip {
      display: flex; gap: 10px; overflow-x: auto; padding: 8px; background: #f1f5f9; border: 1px solid #cbd5e1; margin-bottom: 15px; min-height: 100px; align-items: center;
    }
    .selected-thumb-card {
      position: relative; width: 65px; background: #fff; border: 1px solid #94a3b8; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 3px;
    }
    .selected-thumb-card img { width: 45px; height: 58px; object-fit: cover; background: #000; }
    .selected-thumb-card input { width: 55px; font-size: 10px; padding: 2px; margin-top: 3px; text-align: center; border: 1px solid #ccc; }
    .remove-bundle-item { position: absolute; top: 1px; right: 2px; color: #dc2626; font-weight: bold; font-size: 11px; cursor: pointer; }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 3px; }
    .form-group label { font-size: 11px; font-weight: 600; color: #333; }
    .form-group input { padding: 7px; border: 1px solid #ccc; font-size: 12px; }

    /* Fuld bredde menu-dropdowns med flydende ikon i højre side */
    .icon-dropdown { position: relative; width: 100%; }
    .icon-dropdown-btn {
      width: 100%; height: 38px; border: 1px solid #ccc; background: #fff;
      display: flex; align-items: center; justify-content: space-between; cursor: pointer; overflow: hidden; position: relative;
    }
    .icon-dropdown-selected {
      width: 100%; height: 100%; position: relative; display: flex; align-items: center;
    }
    .icon-dropdown-selected img.menu-bg {
      width: 100%; height: 100%; object-fit: fill; display: block;
    }
    .icon-dropdown-selected img.menu-arrow {
      position: absolute; right: 8px; width: 16px; height: 16px; object-fit: contain; pointer-events: none;
    }
    .icon-dropdown-list {
      display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff;
      border: 1px solid #999; border-top: none; max-height: 200px; overflow-y: auto; z-index: 1000;
    }
    .icon-dropdown-list.open { display: block; }
    .icon-dropdown-option {
      width: 100%; height: 36px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #f3f3f3; position: relative; overflow: hidden;
    }
    .icon-dropdown-option:hover { background: #f0f4ff; }
    .icon-dropdown-option img.menu-opt-bg {
      width: 100%; height: 100%; object-fit: fill; display: block;
    }

    .doc-upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
    .doc-square { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #f4f4f4; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .doc-square img.doc-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .doc-edit-mini-btn { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.75); color: #fff; border: 1px solid rgba(255,255,255,0.7); font-size: 9px; padding: 2px 5px; cursor: pointer; z-index: 5; }
  </style>
</head>
<body>

  <header>
    <h2>Aktive Varer</h2>
    <div><a class="nav-btn" href="sold.html">Solgte Varer &rarr;</a></div>
  </header>

  <div style="padding: 0 20px;">
    <div class="controls-bar">
      <input type="text" id="searchInput" placeholder="Søg i titel, mærke, str..." oninput="filterActiveItems()">
    </div>
    <div class="grid" id="activeContainer">Indlæser aktive varer...</div>
  </div>

  <!-- MARKER SOM SOLGT MODAL -->
  <div class="modal" id="markSoldModal" onclick="if(event.target === this) closeMarkSoldModal()">
    <div class="modal-card">
      <h3>Marker som solgt (Ordre oprettelse)</h3>
      <label style="font-size:11px; font-weight:600; color:#333; margin-bottom:4px; display:block;">Vælg varer der indgår i ordren:</label>
      
      <div class="bundle-picker-container">
        <div class="picker-categories" id="pickerCategories"></div>
        <div class="picker-items-grid" id="pickerItemsGrid"></div>
      </div>

      <label style="font-size:11px; font-weight:600; color:#333; margin-bottom:4px; display:block;">Valgte varer i ordre (angiv individuel salgspris):</label>
      <div class="selected-bundle-strip" id="selectedBundleStrip">
        <span style="font-size:11px; color:#666;">Ingen varer valgt endnu.</span>
      </div>

      <form id="markSoldForm" onsubmit="handleMarkSoldSubmit(event)">
        <div class="form-grid-2">
          <div class="form-group">
            <label>Ordre total:</label>
            <input type="text" id="soldOrderTotal" readonly style="background:#f1f5f9; font-weight:700;" value="0,00 kr.">
          </div>
          <div class="form-group">
            <label>Salgsdato (DD/MM/ÅÅÅÅ):</label>
            <input type="text" id="soldDate" placeholder="DD/MM/ÅÅÅÅ">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Platform:</label>
            <div class="icon-dropdown" id="modal_dd_platform"></div>
          </div>
          <div class="form-group">
            <label>Købers brugernavn:</label>
            <div style="display:flex; align-items:center; gap:5px;">
              <img id="modalUserIcon" src="" style="width:20px; height:20px; object-fit:contain;" alt="">
              <input type="text" id="soldUsername" placeholder="Brugernavn">
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Destination:</label>
            <div class="icon-dropdown" id="modal_dd_destination"></div>
          </div>
          <div class="form-group">
            <label>Købers navn:</label>
            <div style="display:flex; align-items:center; gap:5px;">
              <img src="https://lh3.googleusercontent.com/d/1re723daIGL0sxmLhcuxDMR20ZM7-gCWY" style="width:20px; height:20px; object-fit:contain;" alt="">
              <input type="text" id="soldName" placeholder="Fulde navn">
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Fragtfirma:</label>
            <div class="icon-dropdown" id="modal_dd_courier"></div>
          </div>
          <div class="form-group">
            <label>Pakkenummer:</label>
            <div style="display:flex; align-items:center; gap:5px;">
              <img src="https://lh3.googleusercontent.com/d/1AU1QER6wU2TNsHf02oQAvPSP0MX-w_0N" style="width:20px; height:20px; object-fit:contain;" alt="">
              <input type="text" id="soldTracking" placeholder="Trackingnummer">
            </div>
          </div>
        </div>

        <div class="doc-upload-grid">
          <div class="form-group">
            <label>Pakke</label>
            <div class="doc-square" id="docSq_parcel">
              <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('docIn_parcel').click()">Edit</button>
              <span style="font-size:10px; color:#888;" id="docTxt_parcel">Intet billede</span>
              <img class="doc-thumb" id="docImg_parcel" src="" style="display:none;">
              <input type="file" id="docIn_parcel" accept="image/*" style="display:none;" onchange="handleModalDoc('parcel', this)">
            </div>
          </div>
          <div class="form-group">
            <label>Pakkelabel</label>
            <div class="doc-square" id="docSq_label">
              <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('docIn_label').click()">Edit</button>
              <span style="font-size:10px; color:#888;" id="docTxt_label">Intet billede</span>
              <img class="doc-thumb" id="docImg_label" src="" style="display:none;">
              <input type="file" id="docIn_label" accept="image/*" style="display:none;" onchange="handleModalDoc('label', this)">
            </div>
          </div>
          <div class="form-group">
            <label>Kvittering</label>
            <div class="doc-square" id="docSq_receipt">
              <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('docIn_receipt').click()">Edit</button>
              <span style="font-size:10px; color:#888;" id="docTxt_receipt">Intet billede</span>
              <img class="doc-thumb" id="docImg_receipt" src="" style="display:none;">
              <input type="file" id="docIn_receipt" accept="image/*" style="display:none;" onchange="handleModalDoc('receipt', this)">
            </div>
          </div>
        </div>

        <div style="margin-top:15px; display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="nav-btn" style="background:#ddd;" onclick="closeMarkSoldModal()">Annuller</button>
          <button type="submit" id="markSoldSubmitBtn" class="nav-btn" style="background:#000; color:#fff;">Gem ordre</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWrM7iN9Xwq1TFVDUmq-X8pms3F3kw1suDttXAFovz7yDSKzdCNgf3RtcEa0cJOsy4jg/exec";
    const gImg = (id) => `https://lh3.googleusercontent.com/d/${id}`;

    const SOLD_BUTTON_ID = "1bheJKVJ52Uqx3lwdWId_tCdBhO5aGL0F";
    const EDIT_BUTTON_ID = "1HsyRpwfH7LQ9HBMPOFITVhZ94F_E-5ty";
    const OPEN_MENU_ICON = "14oc9MOOR91_fwKhldiuDkXlEYcw2gxMJ";
    const CLOSE_MENU_ICON = "1WQydM6EL2vf1aUXxjMMkQMo2ZMQA120S";

    const PLATFORM_OPTIONS = [
      { value: "Vinted", label: "Vinted", menuIcon: "1jQK96GDnU3604ffE0UsHb7go6pGN8kWa", userIcon: "1i_bDNOmNgnCr2QnGyfkKlgvNkmD4_otB" },
      { value: "Tradera", label: "Tradera", menuIcon: "1zRUJZnYBCb-xVyl9QKPZzNMS1lq6Vb4J", userIcon: "10uwozjVSczmLIqVorD-FW_II0dFXvDy7" },
      { value: "Tise", label: "Tise", menuIcon: "1REhU8lYUSiuKGdRb8p1Zk2aWKgQ1W3jx", userIcon: "1gOp7i9YqCFkpc-UFt3fUEdVKkysiY2gR" },
      { value: "Bought", label: "Bought", menuIcon: "1Sa4X7XQUcxypr3s1nE0vysYjYhWdLPMb", userIcon: "1Of7OB7zXgqulaAPlenuq7pYn7kJ0OSVF" },
      { value: "DBA", label: "DBA", menuIcon: "1S8a0BUXl1IJbBtRxfipNt1SZl5GFLktW", userIcon: "1EwbmPge4W9vL3wU8rHVlvyoqfmHAAG_3" },
      { value: "Marketplace", label: "Marketplace", menuIcon: "1vh_jVBmLh6goVh7ayhLT5Gufpt7lE4Nn", userIcon: "1Y3TD9H7OExVjC-5VbKuRMD91inJ_0V16" }
    ];

    const COURIER_OPTIONS = [
      { value: "PostNord", label: "PostNord", menuIcon: "1w7_jiRBaYINhCGHvvjtPFZlXLDTdpvJu" },
      { value: "DAO", label: "DAO", menuIcon: "1y-NEC_5KOVNVQ347v37nB7mKGMLQnNF0" },
      { value: "GLS", label: "GLS", menuIcon: "1feqthGGiWeUmHolmP-m2SPLHLp8JptKw" },
      { value: "Bring", label: "Bring", menuIcon: "1LUZasOO0nE1_3BGEJsWmGjNO9BMWqEKk" },
      { value: "Instabox", label: "Instabox", menuIcon: "1CwuuF7VU3KFFbkvkjI59Yz1YuJN3RPs2" },
      { value: "Pickup", label: "Pickup", menuIcon: "1im8Drr_3LtMBgmC8WvY57wvAt93JSYyH" }
    ];

    const DESTINATION_OPTIONS = [
      { value: "Danmark", label: "Danmark", menuIcon: "1pmIGY2mb1wG-TY9Lpw0PEjySI9S4Ow9q" },
      { value: "Sverige", label: "Sverige", menuIcon: "1qVR8UpSWfbCXzZchDy25X3EZnkAaaDc-" },
      { value: "Polen", label: "Polen", menuIcon: "1jqPgTw5I12w_6VVjZ5gAeHG2igswsE06" },
      { value: "Finland", label: "Finland", menuIcon: "1lDoMLwuKd0UjVx2-b8dQOZ29tLlEfugu" },
      { value: "Tyskland", label: "Tyskland", menuIcon: "1WgCD0IY9g7Dl7kyXhpVoR-MXJImGIj0B" }
    ];

    const CATEGORY_MAP = {
      "Dresses & skirts": ["Strapless dresses", "Mini dresses", "Tank dresses", "Part sleeve dresses", "Full sleeve dresses", "Mini skirts", "Maxi skirts"],
      "Tops & t-shirts": ["Bandeau tops", "Crop strap tops", "Strap tops", "Crop tanktops", "Crop tees", "Tees", "Blouses", "Crop long sleeves", "Long sleeves", "Button shirts"],
      "Long sleeves & blouses": ["Sweatshirts", "Zip hoodies", "Hoodies"],
      "Tights, jeans & shorts": ["Blazers", "Short jackets", "Long jacket"],
      "Jackets, blazers & hoodies": ["Sleeveless bodysuits", "Full sleeve bodysuits", "Playsuits", "Jumpsuits", "Sweat sets", "Onepieces", "Pajamas sets"],
      "Playsuits, bodies & sets": ["Bralettes", "Sports bras", "Bikini tops", "Bikini sets"],
      "Underwear & swimwear": ["Mens tops", "Mens bottoms"]
    };

    let allActiveItems = [];
    let selectedBundleItemsMap = new Map();
    let activeModalState = { platform: "Vinted", destination: "Danmark", courier: "PostNord" };
    let modalDocs = { parcel: "", label: "", receipt: "" };
    let currentFilterCat = "";
    let currentFilterSub = "";

    async function loadActiveItems() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=active", { redirect: "follow" });
        const text = await res.text();
        allActiveItems = JSON.parse(text);
        renderActiveGrid(allActiveItems);
      } catch (err) {
        document.getElementById('activeContainer').innerHTML = '<p>Fejl ved indlæsning: ' + err.message + '</p>';
      }
    }

    function renderActiveGrid(items) {
      const container = document.getElementById('activeContainer');
      if (!items || items.length === 0) {
        container.innerHTML = '<p>Ingen aktive varer fundet.</p>';
        return;
      }
      container.innerHTML = items.map((item, idx) => `
        <div class="item-card">
          <div class="image-container">
            <button class="sold-corner-btn" title="Marker som solgt" onclick="openMarkSoldModal(${item.active_id})">
              <img src="${gImg(SOLD_BUTTON_ID)}" alt="Solgt">
            </button>
            <button class="edit-corner-btn" title="Rediger vare">
              <img src="${gImg(EDIT_BUTTON_ID)}" alt="Rediger">
            </button>
            ${item.image_id ? `<img src="${gImg(item.image_id)}" alt="${item.title}">` : '<div style="color:#777; text-align:center; padding-top:100px;">Mangler</div>'}
            <div class="size-badge">${item.size || '-'}</div>
          </div>
          <div class="info-box">
            <div class="info-title">${item.title || ''}</div>
            <div class="info-brand">${item.brand || ''}</div>
          </div>
        </div>
      `).join('');
    }

    function filterActiveItems() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allActiveItems.filter(i => 
        String(i.title || '').toLowerCase().includes(q) ||
        String(i.brand || '').toLowerCase().includes(q) ||
        String(i.size || '').toLowerCase().includes(q)
      );
      renderActiveGrid(filtered);
    }

    function openMarkSoldModal(initialActiveId) {
      selectedBundleItemsMap.clear();
      if (initialActiveId) {
        const found = allActiveItems.find(i => String(i.active_id) === String(initialActiveId));
        if (found) selectedBundleItemsMap.set(String(found.active_id), { ...found, price: "0,00 kr." });
      }

      currentFilterCat = Object.keys(CATEGORY_MAP)[0];
      currentFilterSub = CATEGORY_MAP[currentFilterCat][0];

      renderPickerCategories();
      renderPickerItemsGrid();
      renderSelectedBundleStrip();

      const today = new Date();
      document.getElementById('soldDate').value = `${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
      document.getElementById('soldUsername').value = '';
      document.getElementById('soldName').value = '';
      document.getElementById('soldTracking').value = '';

      renderModalDropdown('modal_dd_platform', 'platform', PLATFORM_OPTIONS, 'Vinted', onPlatformChange);
      renderModalDropdown('modal_dd_destination', 'destination', DESTINATION_OPTIONS, 'Danmark');
      renderModalDropdown('modal_dd_courier', 'courier', COURIER_OPTIONS, 'PostNord');

      document.getElementById('markSoldModal').classList.add('show');
    }

    function closeMarkSoldModal() {
      document.getElementById('markSoldModal').classList.remove('show');
    }

    function renderPickerCategories() {
      const container = document.getElementById('pickerCategories');
      container.innerHTML = Object.entries(CATEGORY_MAP).map(([cat, subs]) => `
        <div>
          <div class="cat-item" onclick="selectCategory('${cat}')">${cat}</div>
          <div class="subcat-list">
            ${subs.map(sub => `<div class="subcat-item ${currentFilterCat === cat && currentFilterSub === sub ? 'active' : ''}" onclick="selectSubcategory('${cat}', '${sub}')">${sub}</div>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function selectCategory(cat) {
      currentFilterCat = cat;
      currentFilterSub = CATEGORY_MAP[cat][0];
      renderPickerCategories();
      renderPickerItemsGrid();
    }

    function selectSubcategory(cat, sub) {
      currentFilterCat = cat;
      currentFilterSub = sub;
      renderPickerCategories();
      renderPickerItemsGrid();
    }

    function renderPickerItemsGrid() {
      const container = document.getElementById('pickerItemsGrid');
      const filtered = allActiveItems.filter(i => String(i.subcategory || '').trim().toLowerCase() === currentFilterSub.toLowerCase());

      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding:10px; font-size:11px; color:#666;">Ingen varer i "${currentFilterSub}".</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isSelected = selectedBundleItemsMap.has(String(item.active_id));
        return `
          <div class="picker-item-row ${isSelected ? 'selected' : ''}" onclick="toggleBundleItem('${item.active_id}')">
            <div class="picker-item-info">
              <img src="${item.image_id ? gImg(item.image_id) : ''}" alt="">
              <div>
                <div style="font-weight:700;">${item.title || ''}</div>
                <div style="color:#666; font-size:10px;">${item.brand || ''} - Str. ${item.size || ''}</div>
              </div>
            </div>
            <span style="font-weight:bold; font-size:12px; color:${isSelected ? '#0062FF' : '#999'};">${isSelected ? '✓' : '+'}</span>
          </div>
        `;
      }).join('');
    }

    function toggleBundleItem(activeId) {
      const sId = String(activeId);
      if (selectedBundleItemsMap.has(sId)) {
        selectedBundleItemsMap.delete(sId);
      } else {
        const found = allActiveItems.find(i => String(i.active_id) === sId);
        if (found) selectedBundleItemsMap.set(sId, { ...found, price: "0,00 kr." });
      }
      renderPickerItemsGrid();
      renderSelectedBundleStrip();
    }

    function renderSelectedBundleStrip() {
      const strip = document.getElementById('selectedBundleStrip');
      const items = Array.from(selectedBundleItemsMap.values());
      
      if (items.length === 0) {
        strip.innerHTML = '<span style="font-size:11px; color:#666;">Ingen varer valgt endnu.</span>';
        document.getElementById('soldOrderTotal').value = "0,00 kr.";
        return;
      }

      strip.innerHTML = items.map(item => `
        <div class="selected-thumb-card">
          <span class="remove-bundle-item" onclick="toggleBundleItem('${item.active_id}')">&times;</span>
          <img src="${item.image_id ? gImg(item.image_id) : ''}" alt="">
          <input type="text" value="${item.price || '0,00 kr.'}" onchange="updateBundleItemPrice('${item.active_id}', this.value)">
        </div>
      `).join('');

      let total = 0;
      items.forEach(i => {
        let clean = String(i.price || "0").replace(/kr\.?/gi, "").replace(/\./g, "").replace(",", ".").trim();
        let num = parseFloat(clean);
        if (!isNaN(num)) total += num;
      });
      document.getElementById('soldOrderTotal').value = `${total.toFixed(2).replace(".", ",")} kr.`;
    }

    function updateBundleItemPrice(activeId, val) {
      const item = selectedBundleItemsMap.get(String(activeId));
      if (item) {
        let cleaned = String(val).replace(/kr\.?/gi, "").trim();
        if (cleaned.includes(",") && cleaned.includes(".")) cleaned = cleaned.replace(/\./g, "").replace(",", ".");
        else if (cleaned.includes(",")) cleaned = cleaned.replace(",", ".");
        let num = parseFloat(cleaned);
        item.price = !isNaN(num) ? `${num.toFixed(2).replace(".", ",")} kr.` : `${cleaned} kr.`;
        renderSelectedBundleStrip();
      }
    }

    function renderModalDropdown(containerId, key, options, selectedVal, onChangeCb) {
      const container = document.getElementById(containerId);
      const selObj = options.find(o => o.value === selectedVal) || options[0];
      activeModalState[key] = selObj.value;

      container.innerHTML = `
        <div class="icon-dropdown-btn" onclick="toggleModalDropdown(event, '${containerId}')">
          <div class="icon-dropdown-selected">
            <img class="menu-bg" src="${gImg(selObj.menuIcon)}" alt="${selObj.label}">
            <img class="menu-arrow" src="${gImg(OPEN_MENU_ICON)}" alt="open">
          </div>
        </div>
        <div class="icon-dropdown-list">
          ${options.map(opt => `
            <div class="icon-dropdown-option" onclick="selectModalOption('${containerId}', '${key}', '${opt.value}')">
              <img class="menu-opt-bg" src="${gImg(opt.menuIcon)}" alt="${opt.label}">
            </div>
          `).join('')}
        </div>
      `;
      if (onChangeCb) onChangeCb(selObj.value);
    }

    function toggleModalDropdown(e, containerId) {
      e.stopPropagation();
      document.querySelectorAll('.icon-dropdown-list').forEach(l => { 
        if(l.parentElement.id !== containerId) {
          l.classList.remove('open');
          const arr = l.parentElement.querySelector('.menu-arrow');
          if(arr) arr.src = gImg(OPEN_MENU_ICON);
        }
      });
      const list = document.querySelector(`#${containerId} .icon-dropdown-list`);
      const arrow = document.querySelector(`#${containerId} .menu-arrow`);
      list.classList.toggle('open');
      if(arrow) {
        arrow.src = list.classList.contains('open') ? gImg(CLOSE_MENU_ICON) : gImg(OPEN_MENU_ICON);
      }
    }

    function selectModalOption(containerId, key, val) {
      activeModalState[key] = val;
      const optionsMap = { platform: PLATFORM_OPTIONS, destination: DESTINATION_OPTIONS, courier: COURIER_OPTIONS };
      renderModalDropdown(containerId, key, optionsMap[key], val, key === 'platform' ? onPlatformChange : null);
    }

    window.addEventListener('click', () => {
      document.querySelectorAll('.icon-dropdown-list').forEach(l => l.classList.remove('open'));
      document.querySelectorAll('.menu-arrow').forEach(a => a.src = gImg(OPEN_MENU_ICON));
    });

    function onPlatformChange(val) {
      activeModalState.platform = val;
      const pObj = PLATFORM_OPTIONS.find(p => p.value === val);
      if (pObj) document.getElementById('modalUserIcon').src = gImg(pObj.userIcon);
    }

    function handleModalDoc(type, input) {
      if (!input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = () => {
        modalDocs[type] = reader.result;
        document.getElementById(`docTxt_${type}`).style.display = 'none';
        const img = document.getElementById(`docImg_${type}`);
        img.src = reader.result;
        img.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    }

    async function handleMarkSoldSubmit(e) {
      e.preventDefault();
      if (selectedBundleItemsMap.size === 0) {
        alert("Vælg mindst én vare til ordren.");
        return;
      }

      const itemsArr = Array.from(selectedBundleItemsMap.values()).map(i => ({
        active_id: i.active_id,
        price: i.price
      }));

      const payload = {
        action: "processSale",
        order: {
          items: itemsArr,
          date: document.getElementById('soldDate').value,
          platform: activeModalState.platform,
          name: document.getElementById('soldName').value,
          username: document.getElementById('soldUsername').value,
          destination: activeModalState.destination,
          courier: activeModalState.courier,
          tracking: document.getElementById('soldTracking').value,
          parcelBase64: modalDocs.parcel,
          labelBase64: modalDocs.label,
          receiptBase64: modalDocs.receipt
        }
      };

      const btn = document.getElementById('markSoldSubmitBtn');
      btn.disabled = true;
      btn.innerText = 'Gemmer ordre...';

      try {
        const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        const resData = await res.json();
        if (resData.status === "ok") {
          closeMarkSoldModal();
          loadActiveItems();
        } else {
          alert("Fejl: " + resData.message);
        }
      } catch (err) {
        alert("Netværksfejl: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Gem ordre';
      }
    }

    window.onload = loadActiveItems;
  </script>
</body>
</html>
