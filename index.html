<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktive Varer - Sam's Organizer</title>
  <style>
    :root {
      --bg-image: url('https://lh3.googleusercontent.com/d/1OCMi6ercH1tisFW6oVOidKwVX1rNS_Hn');
      --dd-height: clamp(26px, 5.5vw, 34px);
      --column-width: 275px;
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111 var(--bg-image) no-repeat center center fixed;
      background-size: cover; color: #eee; padding: 20px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; background: rgba(0,0,0,0.6); padding: 15px 20px;
      backdrop-filter: blur(8px);
    }
    .nav-btn {
      background: #fff; color: #111; padding: 8px 16px; border-radius: 0;
      text-decoration: none; font-weight: 600; font-size: 13px; margin-left: 10px;
      cursor: pointer; border: none; display: inline-block;
    }

    .filter-bar {
      display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.6);
      padding: 12px 15px; backdrop-filter: blur(8px); flex-wrap: wrap; align-items: center;
      position: relative; z-index: 50;
    }
    .filter-bar > #searchInput {
      padding: 8px; border: 1px solid #444; background: #222; color: #fff;
      font-size: 12px; flex: 1; min-width: 200px;
    }

    .category-dropdown-container { position: relative; display: inline-block; }
    .dropdown-toggle-btn {
      background: #222; color: #fff; border: 1px solid #444; padding: 8px 14px;
      cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px;
    }
    .dropdown-panel {
      display: none; position: absolute; top: 100%; right: 0; background: #181818;
      border: 1px solid #555; width: 340px; max-height: 480px; overflow-y: auto;
      z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.9); text-align: left !important;
    }
    .dropdown-panel.show { display: block; }
    .dropdown-header { font-size: 11px; font-weight: bold; color: #aaa; border-bottom: 1px solid #333; padding: 10px 12px; }

    .cat-item-row { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2a2a2a; color: #fff; background: #181818; width: 100%; }
    .cat-item-row:hover { background: #222; }
    .cat-left-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .cat-item-row input[type="checkbox"], .sub-item-row input[type="checkbox"] { width: 16px !important; height: 16px !important; accent-color: #fff; cursor: pointer; }
    .cat-name { flex: 1; font-weight: bold; }
    .cat-arrow { color: #aaa; font-size: 10px; padding-left: 10px; }

    .sub-panel { display: none; background: #121212; border-bottom: 1px solid #2a2a2a; padding: 4px 0; width: 100%; }
    .sub-panel.show { display: block; }
    .sub-item-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 30px !important; font-size: 11px; color: #ddd; width: 100%; }
    .sub-item-row:hover { background: #1c1c1c; }
    .sub-name { flex: 1; color: #ccc; }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
    }
    @media (max-width: 1400px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 650px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

    .item-card {
      background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid #333; position: relative; z-index: 1;
    }
    .image-container { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; overflow: hidden; }
    .image-container > img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(80%); }
    
    .card-btn {
      position: absolute; top: 6px; width: 26px; height: 26px; border: none;
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; z-index: 10; background: transparent;
    }
    .card-btn img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9)); }
    .btn-edit { left: 6px; }
    .btn-sell { right: 6px; }

    .info-box {
      background: #ffffff; color: #222; padding: 10px; font-size: 11px;
      display: flex; flex-direction: column; gap: 6px; flex-grow: 1; justify-content: space-between;
    }
    .info-title { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-meta { color: #666; font-size: 10px; display: flex; justify-content: space-between; }
    
    .platform-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 0;
      margin-top: 4px; border-top: 1px solid #eee; width: 100%; background: #fff;
    }
    .platform-icon-btn {
      background: transparent; border: none; cursor: pointer; padding: 0; margin: 0;
      display: flex; align-items: center; justify-content: center; width: 100%; height: 28px;
    }
    .platform-icon-btn img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      filter: grayscale(100%) opacity(35%); transition: filter 0.2s;
    }
    .platform-icon-btn.active img { filter: grayscale(0%) opacity(100%); }

    /* MODAL */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 99999;
      align-items: center; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: #fff; color: #222; padding: 18px;
      width: 95%; max-width: 610px; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }

    .bundle-picker-box {
      display: grid; grid-template-columns: 160px 160px 1fr; gap: 6px;
      background: #f8f9fa; border: 1px solid #ddd; padding: 6px; margin-bottom: 12px; height: 180px;
    }
    @media (max-width: 600px) {
      .bundle-picker-box { grid-template-columns: 1fr; height: auto; max-height: 220px; }
    }
    .modal-col { border-right: 1px solid #ddd; padding-right: 4px; overflow-y: auto; height: 100%; display: flex; flex-direction: column; gap: 2px; }
    .modal-col:last-child { border-right: none; }
    
    .modal-cat-header {
      font-size: 10.5px; font-weight: 700; padding: 5px 6px; cursor: pointer; color: #111; background: #e2e8f0;
      display: flex; justify-content: space-between; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-cat-header:hover, .modal-cat-header.active { background: #cbd5e1; color: #0062FF; }
    
    .modal-sub-item {
      font-size: 10px; padding: 5px 6px; cursor: pointer; color: #444; border-bottom: 1px solid #eee;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-sub-item:hover, .modal-sub-item.active { background: #0062FF; color: #fff; font-weight: 600; }

    .modal-item-row {
      display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #ccc; padding: 3px 6px; cursor: pointer; margin-bottom: 3px;
    }
    .modal-item-row:hover { background: #f1f5f9; }
    .modal-item-row.selected { border-color: #0062FF; background: #eff6ff; }
    .modal-item-left { display: flex; align-items: center; gap: 6px; font-size: 10px; overflow: hidden; }
    .modal-item-left img { width: 24px; height: 32px; object-fit: cover; background: #000; flex-shrink: 0; }

    .selected-strip {
      display: flex; gap: 8px; overflow-x: auto; padding: 6px; background: #f1f5f9; border: 1px solid #cbd5e1; margin-bottom: 10px; min-height: 78px; align-items: center;
    }
    .selected-card {
      position: relative; width: 60px; background: #fff; border: 1px solid #94a3b8; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 3px;
    }
    .selected-card img { width: 38px; height: 50px; object-fit: cover; background: #000; }
    .selected-card input { width: 52px; font-size: 10px; padding: 2px; margin-top: 2px; text-align: center; border: 1px solid #ccc; }
    .selected-remove { position: absolute; top: 0; right: 2px; color: #dc2626; font-weight: bold; font-size: 12px; cursor: pointer; line-height: 1; }

    .sale-grid-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
    }
    .sale-grid-columns {
      display: grid;
      grid-template-columns: var(--column-width) var(--column-width);
      gap: 15px;
      width: fit-content;
      max-width: 100%;
    }
    @media (max-width: 600px) {
      .sale-grid-columns { grid-template-columns: 1fr; width: 100%; }
    }
    .sale-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: var(--column-width);
    }

    .form-group { display: flex; flex-direction: column; gap: 2px; width: 100%; }
    .form-group label { font-size: 11px; font-weight: 600; color: #333; }
    .form-group input { height: var(--dd-height); padding: 4px 8px; border: 1px solid #ccc; font-size: 12px; width: 100%; }

    .date-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .date-input-wrap input { width: 100%; padding-right: 30px; }
    .calendar-icon-btn {
      position: absolute; right: 6px; background: transparent; border: none; cursor: pointer; padding: 0; display: flex; align-items: center;
    }
    .calendar-icon-btn img { width: 16px; height: 16px; object-fit: contain; }
    .hidden-date-picker { position: absolute; right: 0; top: 0; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

    /* KUN BREDDEN AF BILLEDET + PIL OVEN PÅ TIL HØJRE UTEN BAGGRUND */
    .menu-dd {
      position: relative;
      display: inline-block;
      width: auto;
    }
    .menu-dd-btn {
      position: relative;
      height: var(--dd-height);
      width: auto;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      border: 1px solid #ccc;
      background: transparent;
      padding: 0;
      overflow: visible;
    }
    .menu-dd-btn img.menu-img {
      height: 100%;
      width: auto;
      max-height: calc(var(--dd-height) - 2px);
      object-fit: contain;
      display: block;
    }
    .menu-dd-btn img.menu-toggle-icon {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      height: 14px;
      width: 14px;
      object-fit: contain;
      pointer-events: none;
      z-index: 10;
      background: transparent !important;
      padding: 0 !important;
    }
    .menu-dd-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 100%;
      background: #fff;
      border: 1px solid #999;
      border-top: none;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .menu-dd-list.open { display: block; }
    .menu-dd-opt {
      height: var(--dd-height);
      width: 100%;
      display: flex;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      background: #fff;
      padding: 0 4px;
    }
    .menu-dd-opt:hover { filter: brightness(0.92); }
    .menu-dd-opt img.menu-img {
      height: 100%;
      width: auto;
      max-height: calc(var(--dd-height) - 2px);
      object-fit: contain;
      display: block;
    }

    .doc-upload-grid {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
      margin-bottom: 0;
    }
    .doc-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100px;
    }
    .doc-col label { font-size: 11px; font-weight: 600; color: #333; margin-bottom: 3px; }
    .doc-square {
      position: relative;
      width: 100px;
      height: 100px;
      background: #f9f9f9;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .doc-square img.doc-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .doc-edit-mini-btn { position: absolute; top: 3px; left: 3px; background: rgba(0,0,0,0.75); color: #fff; border: none; font-size: 8.5px; padding: 2px 4px; cursor: pointer; z-index: 5; }

    .modal-bottom-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -32px;
      position: relative;
      z-index: 20;
      pointer-events: none;
    }
    .modal-bottom-actions button { pointer-events: auto; }
  </style>
</head>
<body>
  <!-- HTML og script uændret i sin funktion -->
</body>
</html>
