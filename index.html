<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Aktive Varer - Sam's Organizer</title>
  <style>
    :root {
      --bg-image: url('https://lh3.googleusercontent.com/d/1OCMi6ercH1tisFW6oVOidKwVX1rNS_Hn');
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111 var(--bg-image) no-repeat center center fixed;
      background-size: cover; color: #eee; padding: 20px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; background: rgba(0,0,0,0.6); padding: 15px 20px;
      border-radius: 0; backdrop-filter: blur(8px);
    }
    .nav-btn {
      background: #fff; color: #111; padding: 8px 16px; border-radius: 0;
      text-decoration: none; font-weight: 600; font-size: 13px; margin-left: 10px;
      cursor: pointer; border: none; display: inline-block;
    }

    /* Filter & Søgebar */
    .filter-bar {
      display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.6);
      padding: 12px 15px; border-radius: 0; backdrop-filter: blur(8px); flex-wrap: wrap; align-items: center;
      position: relative; z-index: 50;
    }
    .filter-bar > #searchInput {
      padding: 8px; border: 1px solid #444; background: #222; color: #fff;
      border-radius: 0; font-size: 12px; flex: 1; min-width: 200px;
    }

    /* Kategori Dropdown Menu Layout */
    .category-dropdown-container { position: relative; display: inline-block; }
    .dropdown-toggle-btn {
      background: #222; color: #fff; border: 1px solid #444; padding: 8px 14px;
      cursor: pointer; font-size: 12px; border-radius: 0; display: flex; align-items: center; gap: 6px;
    }
    .dropdown-panel {
      display: none; position: absolute; top: 100%; right: 0; background: #181818;
      border: 1px solid #555; width: 340px; max-height: 480px; overflow-y: auto;
      z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.9); padding: 0; margin-top: 4px;
      text-align: left !important;
    }
    .dropdown-panel.show { display: block; }
    .dropdown-header { font-size: 11px; font-weight: bold; color: #aaa; border-bottom: 1px solid #333; padding: 10px 12px; }

    .cat-item-row { display: flex; align-items: center; justify-content: flex-start; padding: 10px 12px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2a2a2a; color: #fff; background: #181818; width: 100%; }
    .cat-item-row:hover { background: #222; }
    .cat-left-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .cat-item-row input[type="checkbox"], .sub-item-row input[type="checkbox"] { width: 16px !important; height: 16px !important; accent-color: #fff; cursor: pointer; }
    .cat-name { flex: 1; font-weight: bold; }
    .cat-arrow { color: #aaa; font-size: 10px; padding-left: 10px; }

    .sub-panel { display: none; background: #121212; border-bottom: 1px solid #2a2a2a; padding: 4px 0; width: 100%; }
    .sub-panel.show { display: block; }
    .sub-item-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 30px !important; font-size: 11px; color: #ddd; width: 100%; }
    .sub-item-row:hover { background: #1c1c1c; }
    .sub-name { flex: 1; color: #ccc; }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }
    @media (min-width: 1200px) { .grid { grid-template-columns: repeat(6, 1fr); } }
    @media (min-width: 1400px) { .grid { grid-template-columns: repeat(7, 1fr); } }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 650px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

    .item-card {
      background: #1a1a1a; border-radius: 0 !important; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid #333; position: relative; z-index: 1;
    }
    .image-container {
      position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; overflow: hidden;
    }
    .image-container > img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(80%); }
    
    .card-btn {
      position: absolute; top: 6px; width: 26px; height: 26px; border-radius: 0 !important;
      border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; z-index: 10;
      background: transparent;
    }
    .card-btn img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9)); }
    .btn-edit { left: 6px; }
    .btn-sell { right: 6px; }

    .info-box {
      background: #ffffff; color: #222; padding: 10px; font-size: 11px;
      display: flex; flex-direction: column; gap: 6px; flex-grow: 1; justify-content: space-between;
    }
    .info-title { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-meta { color: #666; font-size: 10px; display: flex; justify-content: space-between; }
    
    .platform-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 0;
      margin-top: 4px; border-top: 1px solid #eee; width: 100%; background: #fff;
    }
    .platform-icon-btn {
      background: transparent; border: none; cursor: pointer; padding: 0; margin: 0;
      display: flex; align-items: center; justify-content: center; width: 100%; height: 28px;
    }
    .platform-icon-btn img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      filter: grayscale(100%) opacity(35%); transition: filter 0.2s;
    }
    .platform-icon-btn.active img { filter: grayscale(0%) opacity(100%); }

    /* MODALER */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 99999;
      align-items: center; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: #fff; color: #222; padding: 20px; border-radius: 0;
      width: 95%; max-width: 680px; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }

    /* Nøjagtigt som dit skærmbillede: 3 kolonner i bundle-picker */
    .bundle-picker-box {
      display: grid; grid-template-columns: 160px 160px 1fr; gap: 8px;
      background: #f8f9fa; border: 1px solid #ddd; padding: 8px; margin-bottom: 12px; height: 220px;
    }
    .modal-col { border-right: 1px solid #ddd; padding-right: 4px; overflow-y: auto; height: 100%; display: flex; flex-direction: column; gap: 2px; }
    .modal-col:last-child { border-right: none; }
    
    .modal-cat-header {
      font-size: 10.5px; font-weight: 700; padding: 5px 6px; cursor: pointer; color: #111; background: #e2e8f0;
      display: flex; justify-content: space-between; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-cat-header:hover, .modal-cat-header.active { background: #cbd5e1; color: #0062FF; }
    
    .modal-sub-item {
      font-size: 10px; padding: 5px 6px; cursor: pointer; color: #444; border-bottom: 1px solid #eee;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-sub-item:hover, .modal-sub-item.active { background: #0062FF; color: #fff; font-weight: 600; }

    .modal-item-row {
      display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #ccc; padding: 4px 6px; cursor: pointer; margin-bottom: 4px;
    }
    .modal-item-row:hover { background: #f1f5f9; }
    .modal-item-row.selected { border-color: #0062FF; background: #eff6ff; }
    .modal-item-left { display: flex; align-items: center; gap: 6px; font-size: 10.5px; overflow: hidden; }
    .modal-item-left img { width: 26px; height: 35px; object-fit: cover; background: #000; flex-shrink: 0; }

    .selected-strip {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px; background: #f1f5f9; border: 1px solid #cbd5e1; margin-bottom: 14px; min-height: 92px; align-items: center;
    }
    .selected-card {
      position: relative; width: 68px; background: #fff; border: 1px solid #94a3b8; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 3px;
    }
    .selected-card img { width: 46px; height: 60px; object-fit: cover; background: #000; }
    .selected-card input { width: 60px; font-size: 10px; padding: 2px; margin-top: 3px; text-align: center; border: 1px solid #ccc; }
    .selected-remove { position: absolute; top: 0; right: 2px; color: #dc2626; font-weight: bold; font-size: 12px; cursor: pointer; line-height: 1; }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; font-weight: 600; color: #333; }
    .form-group input, .form-group select { padding: 7px; border: 1px solid #ccc; border-radius: 0; font-size: 12px; width: 100%; }

    .menu-dd { position: relative; width: 100%; }
    .menu-dd-btn {
      width: 100%; height: 34px; border: 1px solid #ccc; background: #fff;
      display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 0 8px 0 0; position: relative;
    }
    .menu-dd-btn img.menu-img { height: 100%; width: auto; max-width: calc(100% - 24px); object-fit: contain; display: block; }
    .menu-dd-btn img.menu-toggle-icon { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; pointer-events: none; }
    .menu-dd-list {
      display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff;
      border: 1px solid #999; border-top: none; max-height: 210px; overflow-y: auto; z-index: 1000;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }
    .menu-dd-list.open { display: block; }
    .menu-dd-opt { width: 100%; height: 34px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #f0f0f0; background: #fff; }
    .menu-dd-opt:hover { background: #f0f4ff; }
    .menu-dd-opt img.menu-img { height: 100%; width: auto; max-width: 100%; object-fit: contain; display: block; }

    .doc-upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
    .doc-square { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #f4f4f4; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .doc-square img.doc-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .doc-edit-mini-btn { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.75); color: #fff; border: 1px solid rgba(255,255,255,0.7); font-size: 9px; padding: 2px 5px; cursor: pointer; z-index: 5; }
  </style>
</head>
<body>

  <header>
    <h2>Aktive Varer</h2>
    <div>
      <button class="nav-btn" onclick="openUploadModal()">+ Upload ny vare</button>
      <a class="nav-btn" href="sold.html">Solgte Varer &rarr;</a>
    </div>
  </header>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Søg i titel, mærke, str, kat, platform..." oninput="filterGrid()">
    <div class="category-dropdown-container">
      <button class="dropdown-toggle-btn" onclick="toggleCategoryMenu(event)">Vælg kategorier &or;</button>
      <div class="dropdown-panel" id="categoryDropdownPanel">
        <div class="dropdown-header">Filter efter kategori / underkategori</div>
        <div id="categoryCheckboxesContainer"></div>
      </div>
    </div>
  </div>

  <div class="grid" id="itemsContainer">Indlæser aktive varer...</div>

  <!-- UPLOAD MODAL -->
  <div class="modal" id="uploadModal" onclick="if(event.target === this) closeModal('uploadModal')">
    <div class="modal-card">
      <div class="modal-title">Upload ny vare</div>
      <form id="uploadForm" onsubmit="handleUpload(event)">
        <div class="form-group"><label>Titel:</label><input type="text" name="title" required></div>
        <div class="form-group"><label>Mærke:</label><input type="text" name="brand"></div>
        <div class="form-group"><label>Størrelse:</label><input type="text" name="size"></div>
        <div class="form-group"><label>Kategori:</label><input type="text" name="category"></div>
        <div class="form-group"><label>Underkategori:</label><input type="text" name="subcategory"></div>
        <div class="form-group"><label>Billede:</label><input type="file" id="uploadFile" accept="image/*" required></div>
        <div style="margin-top:15px; text-align:right;">
          <button type="button" class="nav-btn" style="background:#ddd;" onclick="closeModal('uploadModal')">Annuller</button>
          <button type="submit" class="nav-btn" style="background:#000; color:#fff;">Gem vare</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MARKER SOM SOLGT MODAL -->
  <div class="modal" id="saleModal" onclick="if(event.target === this) closeModal('saleModal')">
    <div class="modal-card">
      <div class="modal-title">Marker som solgt (Ordre oprettelse)</div>
      <form id="saleForm" onsubmit="handleSaleSubmit(event)">
        <label style="font-size:11px; font-weight:600; color:#333; margin-bottom:4px; display:block;">Vælg varer der indgår i ordren:</label>
        
        <!-- Nøjagtigt 3-kolonnet layout som vist på dit skærmbillede -->
        <div class="bundle-picker-box">
          <div class="modal-col" id="colCategories"></div>
          <div class="modal-col" id="colSubcategories"></div>
          <div class="modal-col" id="colItems"></div>
        </div>

        <label style="font-size:11px; font-weight:600; color:#333; margin-bottom:4px; display:block;">Valgte varer i ordre (angiv individuel pris):</label>
        <div class="selected-strip" id="selectedBundleStrip"></div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Ordre total:</label>
            <input type="text" id="saleOrderTotal" readonly style="background:#f1f5f9; font-weight:700;" value="0,00 kr.">
          </div>
          <div class="form-group">
            <label>Salgsdato (DD/MM/ÅÅÅÅ):</label>
            <input type="text" id="saleDate" placeholder="DD/MM/ÅÅÅÅ" required>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Platform:</label>
            <div class="menu-dd" id="dd_sale_platform"></div>
          </div>
          <div class="form-group">
            <label>Brugernavn:</label>
            <div style="display:flex; align-items:center; gap:6px;">
              <img id="saleUserIcon" src="" style="width:18px; height:18px; object-fit:contain;" alt="">
              <input type="text" id="saleUsername" placeholder="Brugernavn">
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Destination:</label>
            <div class="menu-dd" id="dd_sale_destination"></div>
          </div>
          <div class="form-group">
            <label>Navn:</label>
            <div style="display:flex; align-items:center; gap:6px;">
              <img src="https://lh3.googleusercontent.com/d/1re723daIGL0sxmLhcuxDMR20ZM7-gCWY" style="width:18px; height:18px; object-fit:contain;" alt="">
              <input type="text" id="saleName" placeholder="Fulde navn">
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Fragtfirma:</label>
            <div class="menu-dd" id="dd_sale_courier"></div>
          </div>
          <div class="form-group">
            <label>Pakkenummer:</label>
            <div style="display:flex; align-items:center; gap:6px;">
              <img src="https://lh3.googleusercontent.com/d/1AU1QER6wU2TNsHf02oQAvPSP0MX-w_0N" style="width:18px; height:18px; object-fit:contain;" alt="">
              <input type="text" id="saleTracking" placeholder="Pakkenummer">
            </div>
          </div>
        </div>

        <div class="doc-upload-grid">
          <div class="form-group">
            <label>Pakke</label>
            <div class="doc-square">
              <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('parcelFile').click()">Edit</button>
              <span style="font-size:10px; color:#888;" id="txt_parcel">Intet billede</span>
              <img class="doc-thumb" id="img_parcel" src="" style="display:none;">
              <input type="file" id="parcelFile" accept="image/*" style="display:none;" onchange="previewSaleDoc('parcel', this)">
            </div>
          </div>
          <div class="form-group">
            <label>Pakkelabel</label>
            <div class="doc-square">
              <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('labelFile').click()">Edit</button>
              <span style="font-size:10px; color:#888;" id="txt_label">Intet billede</span>
              <img class="doc-thumb" id="img_label" src="" style="display:none;">
              <input type="file" id="labelFile" accept="image/*" style="display:none;" onchange="previewSaleDoc('label', this)">
            </div>
          </div>
          <div class="form-group">
            <label>Kvittering</label>
            <div class="doc-square">
              <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('receiptFile').click()">Edit</button>
              <span style="font-size:10px; color:#888;" id="txt_receipt">Intet billede</span>
              <img class="doc-thumb" id="img_receipt" src="" style="display:none;">
              <input type="file" id="receiptFile" accept="image/*" style="display:none;" onchange="previewSaleDoc('receipt', this)">
            </div>
          </div>
        </div>
        
        <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center;">
          <button type="button" class="nav-btn" style="background:#ddd;" onclick="closeModal('saleModal')">Annuller</button>
          <button type="submit" id="saleSubmitBtn" class="nav-btn" style="background:#28a745; color:#fff;">Gem ordre</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWrM7iN9Xwq1TFVDUmq-X8pms3F3kw1suDttXAFovz7yDSKzdCNgf3RtcEa0cJOsy4jg/exec";
    const gImg = (id) => `https://lh3.googleusercontent.com/d/${id}`;
    let activeItems = [];

      { value: "Tradera", menuId: "1zRUJZnYBCb-xVyl9QKPZzNMS1lq6Vb4J", userId: "10uwozjVSczmLIqVorD-FW_II0dFXvDy7" },

      { value: "Marketplace", menuId: "1vh_jVBmLh6goVh7ayhLT5Gufpt7lE4Nn", userId: "1Y3TD9H7OExVjC-5VbKuRMD91inJ_0V16" }

    const MODAL_DESTINATIONS = [
      { value: "Danmark", menuId: "1pmIGY2mb1wG-TY9Lpw0PEjySI9S4Ow9q" },
      { value: "Sverige", menuId: "1qVR8UpSWfbCXzZchDy25X3EZnkAaaDc-" },
      { value: "Polen", menuId: "1jqPgTw5I12w_6VVjZ5gAeHG2igswsE06" },
      { value: "Finland", menuId: "1lDoMLwuKd0UjVx2-b8dQOZ29tLlEfugu" },
      { value: "Tyskland", menuId: "1WgCD0IY9g7Dl7kyXhpVoR-MXJImGIj0B" }
    ];

    const MODAL_COURIERS = [
      { value: "PostNord", menuId: "1w7_jiRBaYINhCGHvvjtPFZlXLDTdpvJu" },
      { value: "DAO", menuId: "1y-NEC_5KOVNVQ347v37nB7mKGMLQnNF0" },
      { value: "GLS", menuId: "1feqthGGiWeUmHolmP-m2SPLHLp8JptKw" },
      { value: "Bring", menuId: "1LUZasOO0nE1_3BGEJsWmGjNO9BMWqEKk" },
      { value: "Instabox", menuId: "1CwuuF7VU3KFFbkvkjI59Yz1YuJN3RPs2" },
      { value: "Pickup", menuId: "1im8Drr_3LtMBgmC8WvY57wvAt93JSYyH" }
    ];

    let selectedSaleItems = new Map();
    let saleModalState = { platform: "Vinted", destination: "Danmark", courier: "PostNord" };
    let selectedModalCat = "";
    let selectedModalSub = "";

    async function loadItems() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=active", { redirect: "follow" });
        const text = await res.text();
        activeItems = JSON.parse(text);
        buildCategoryMenu();
        renderGrid(activeItems);
      } catch (err) {
        document.getElementById('itemsContainer').innerHTML = '<p>Fejl ved indlæsning af varer.</p>';
      }
    }

    function toggleCategoryMenu(event) {
      if (event) event.stopPropagation();
      const panel = document.getElementById('categoryDropdownPanel');
      if (panel) panel.classList.toggle('show');
    }

    window.addEventListener('click', function(event) {
      if (!event.target.closest('.category-dropdown-container')) {
        const panel = document.getElementById('categoryDropdownPanel');
        if (panel) panel.classList.remove('show');
      }
      if (!event.target.closest('.menu-dd')) {
        document.querySelectorAll('.menu-dd-list').forEach(l => l.classList.remove('open'));
        document.querySelectorAll('.menu-toggle-icon').forEach(i => i.src = gImg(OPEN_MENU_ID));
      }
    });

    function buildCategoryMenu() {
      const container = document.getElementById('categoryCheckboxesContainer');
      if (!container) return;
      container.innerHTML = categoriesData.map((cat, cIdx) => `
        <div>
          <div class="cat-item-row" onclick="toggleSubPanel(${cIdx})">
            <div class="cat-left-group">
              <input type="checkbox" class="cat-cb" value="${cat.name}" onchange="filterGrid()" onclick="event.stopPropagation()">
              <div class="cat-name">${cat.name}</div>
            </div>
            <div class="cat-arrow" id="arrow_${cIdx}">▼</div>
          </div>
          <div class="sub-panel" id="subPanel_${cIdx}">
            ${cat.subs.map(sub => `
              <div class="sub-item-row" onclick="event.stopPropagation()">
                <input type="checkbox" class="sub-cb" data-category="${cat.name}" value="${sub}" onchange="filterGrid()">
                <div class="sub-name">${sub}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleSubPanel(idx) {
      const panel = document.getElementById(`subPanel_${idx}`);
      const arrow = document.getElementById(`arrow_${idx}`);
      if (panel) panel.classList.toggle('show');
      if (arrow) arrow.innerText = panel && panel.classList.contains('show') ? '▲' : '▼';
    }

    function filterGrid() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const selectedCats = Array.from(document.querySelectorAll('.cat-cb:checked')).map(cb => cb.value);
      const selectedSubs = Array.from(document.querySelectorAll('.sub-cb:checked')).map(cb => cb.value);

      const filtered = activeItems.filter(item => {
        const matchesCat = selectedCats.length === 0 || selectedCats.includes(item.category);
        const matchesSub = selectedSubs.length === 0 || selectedSubs.includes(item.subcategory);
        let matchesQuery = true;
        if (q) {
          const searchable = `${item.title} ${item.brand} ${item.size} ${item.category} ${item.subcategory} #${item.active_id}`.toLowerCase();
          matchesQuery = searchable.includes(q);
        }
        return matchesCat && matchesSub && matchesQuery;
      });
      renderGrid(filtered);
    }

    function renderGrid(items) {
      const container = document.getElementById('itemsContainer');
      if (!items || items.length === 0) {
        container.innerHTML = '<p>Ingen aktive varer fundet.</p>';
        return;
      }
      container.innerHTML = items.map(item => {
        const imgSource = item.image_id ? gImg(item.image_id) : '';
        return `
          <div class="item-card">
            <div class="image-container">
              <button class="card-btn btn-edit" title="Rediger vare" onclick="alert('Rediger vare #${item.active_id}')">
                <img src="${gImg(EDIT_ICON_ID)}" alt="Rediger">
              </button>
              <button class="card-btn btn-sell" title="Marker som solgt" onclick="openSaleModalFor(${item.active_id})">
                <img src="${gImg(SOLD_ICON_ID)}" alt="Solgt">
              </button>
              ${imgSource ? `<img src="${imgSource}" alt="${item.title}">` : '<div style="color:#777; text-align:center; padding-top:100px;">Mangler</div>'}
            </div>
            <div class="info-box">
              <div>
                <div class="info-title">${item.title}</div>
                <div class="info-meta">
                  <span>${item.brand || ''}</span>
                  <span>Str. ${item.size || '-'}</span>
                  <span>#${item.active_id}</span>
                </div>
              </div>
              <div class="platform-grid">
                ${platformMeta.map(p => `
                  <button class="platform-icon-btn ${item[p.key] ? 'active' : ''}" title="${p.name}" onclick="togglePlatform(${item.active_id}, '${p.key}', ${!item[p.key]})">
                    <img src="https://lh3.googleusercontent.com/d/${p.id}" alt="${p.name}">
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function togglePlatform(id, field, value) {
      const item = activeItems.find(i => i.active_id === id);
      if (item) item[field] = value;
      filterGrid();
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateActiveState', active_id: id, field: field, value: value })
      });
    }

    function openUploadModal() { document.getElementById('uploadModal').classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    async function handleUpload(e) {
      e.preventDefault();
      const form = e.target;
      const fileInput = document.getElementById('uploadFile');
      const base64 = await fileToBase64(fileInput.files[0]);
      const formData = {
        title: form.title.value, brand: form.brand.value, size: form.size.value,
        category: form.category.value, subcategory: form.subcategory.value
      };
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'uploadActive', form: formData, image: base64, fileName: fileInput.files[0].name })
      });
      closeModal('uploadModal');
      loadItems();
    }

    /* MARKER SOM SOLGT - 3 KOLONNER */
    function openSaleModalFor(primaryId) {
      selectedSaleItems.clear();
      const initialItem = activeItems.find(i => String(i.active_id) === String(primaryId));
      if (initialItem) {
        selectedSaleItems.set(String(initialItem.active_id), { ...initialItem, price: "0,00 kr." });
        selectedModalCat = initialItem.category || categoriesData[0].name;
        selectedModalSub = initialItem.subcategory || "";
      } else {
        selectedModalCat = categoriesData[0].name;
        selectedModalSub = "";
      }

      renderSaleModalColumns();
      renderSelectedStrip();

      let now = new Date();
      document.getElementById('saleDate').value = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
      document.getElementById('saleUsername').value = '';
      document.getElementById('saleName').value = '';
      document.getElementById('saleTracking').value = '';

      ['parcel', 'label', 'receipt'].forEach(t => {
        document.getElementById(`img_${t}`).style.display = 'none';
        document.getElementById(`txt_${t}`).style.display = 'block';
      });

      renderMenuDropdown('dd_sale_platform', 'platform', MODAL_PLATFORMS, 'Vinted', onSalePlatformChange);
      renderMenuDropdown('dd_sale_destination', 'destination', MODAL_DESTINATIONS, 'Danmark');
      renderMenuDropdown('dd_sale_courier', 'courier', MODAL_COURIERS, 'PostNord');

      document.getElementById('saleModal').classList.add('show');
    }

    function renderSaleModalColumns() {
      // Kolonne 1: Kategorier
      const col1 = document.getElementById('colCategories');
      col1.innerHTML = categoriesData.map(cat => {
        const isAct = selectedModalCat === cat.name;
        const cnt = activeItems.filter(i => String(i.category || '').toLowerCase() === cat.name.toLowerCase()).length;
        return `<div class="modal-cat-header ${isAct ? 'active' : ''}" onclick="selectModalCat('${cat.name}')"><span>${cat.name} (${cnt})</span><span>&rsaquo;</span></div>`;
      }).join('');

      // Kolonne 2: Underkategorier for valgt kategori
      const col2 = document.getElementById('colSubcategories');
      const activeCatObj = categoriesData.find(c => c.name === selectedModalCat) || categoriesData[0];
      col2.innerHTML = activeCatObj.subs.map(sub => {
        const isActSub = selectedModalSub === sub;
        const cnt = activeItems.filter(i => String(i.subcategory || '').toLowerCase() === sub.toLowerCase()).length;
        return `<div class="modal-sub-item ${isActSub ? 'active' : ''}" onclick="selectModalSub('${sub}')">${sub} (${cnt})</div>`;
      }).join('');

      // Kolonne 3: Varer baseret på valgt underkategori eller kategori
      const col3 = document.getElementById('colItems');
      const filteredItems = activeItems.filter(item => {
        if (selectedModalSub) return String(item.subcategory || '').toLowerCase() === selectedModalSub.toLowerCase();
        return String(item.category || '').toLowerCase() === selectedModalCat.toLowerCase();
      });

      if (filteredItems.length === 0) {
        col3.innerHTML = `<div style="padding:8px; font-size:10px; color:#666;">Ingen varer.</div>`;
        return;
      }

      col3.innerHTML = filteredItems.map(item => {
        const isSel = selectedSaleItems.has(String(item.active_id));
        const thumb = item.image_id ? gImg(item.image_id) : '';
        return `
          <div class="modal-item-row ${isSel ? 'selected' : ''}" onclick="toggleSelectSaleItem('${item.active_id}')">
            <div class="modal-item-left">
              ${thumb ? `<img src="${thumb}">` : '<div style="width:26px;height:35px;background:#333;"></div>'}
              <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                <b>${item.title}</b><br><span style="font-size:9px; color:#666;">Str. ${item.size || '-'}</span>
              </div>
            </div>
            <span style="font-weight:bold; font-size:12px; color:${isSel ? '#0062FF' : '#999'};">${isSel ? '✓' : '+'}</span>
          </div>
        `;
      }).join('');
    }

    function selectModalCat(catName) {
      selectedModalCat = catName;
      selectedModalSub = ""; // Nulstil underkategori ved skift af hovedkategori
      renderSaleModalColumns();
    }

    function selectModalSub(subName) {
      selectedModalSub = subName;
      renderSaleModalColumns();
    }

    function toggleSelectSaleItem(id) {
      const sId = String(id);
      if (selectedSaleItems.has(sId)) {
        selectedSaleItems.delete(sId);
      } else {
        const found = activeItems.find(i => String(i.active_id) === sId);
        if (found) selectedSaleItems.set(sId, { ...found, price: "0,00 kr." });
      }
      renderSaleModalColumns();
      renderSelectedStrip();
    }

    function renderSelectedStrip() {
      const strip = document.getElementById('selectedBundleStrip');
      const arr = Array.from(selectedSaleItems.values());
      if (arr.length === 0) {
        strip.innerHTML = '<span style="font-size:11px; color:#666;">Ingen varer valgt endnu.</span>';
        document.getElementById('saleOrderTotal').value = "0,00 kr.";
        return;
      }
      strip.innerHTML = arr.map(item => `
        <div class="selected-card">
          <span class="selected-remove" onclick="toggleSelectSaleItem('${item.active_id}')">&times;</span>
          <img src="${item.image_id ? gImg(item.image_id) : ''}" alt="">
          <input type="text" value="${item.price}" onchange="updateSaleItemPrice('${item.active_id}', this.value)">
        </div>
      `).join('');

      let total = 0;
      arr.forEach(i => {
        let clean = String(i.price || "0").replace(/kr\.?/gi, "").replace(/\./g, "").replace(",", ".").trim();
        let num = parseFloat(clean);
        if (!isNaN(num)) total += num;
      });
      document.getElementById('saleOrderTotal').value = `${total.toFixed(2).replace(".", ",")} kr.`;
    }

    function updateSaleItemPrice(id, val) {
      const item = selectedSaleItems.get(String(id));
      if (item) {
        let cleaned = String(val).replace(/kr\.?/gi, "").trim();
        if (cleaned.includes(",") && cleaned.includes(".")) cleaned = cleaned.replace(/\./g, "").replace(",", ".");
        else if (cleaned.includes(",")) cleaned = cleaned.replace(",", ".");
        let num = parseFloat(cleaned);
        item.price = !isNaN(num) ? `${num.toFixed(2).replace(".", ",")} kr.` : `${cleaned} kr.`;
        renderSelectedStrip();
      }
    }

    function renderMenuDropdown(containerId, key, options, selectedVal, cb) {
      const container = document.getElementById(containerId);
      const selObj = options.find(o => o.value === selectedVal) || options[0];
      saleModalState[key] = selObj.value;

      container.innerHTML = `
        <div class="menu-dd-btn" onclick="toggleMenuDropdown(event, '${containerId}')">
          <img class="menu-img" src="${gImg(selObj.menuId)}" alt="${selObj.value}">
          <img class="menu-toggle-icon" src="${gImg(OPEN_MENU_ID)}" alt="">
        </div>
        <div class="menu-dd-list">
          ${options.map(opt => `
            <div class="menu-dd-opt" onclick="selectMenuDropdown('${containerId}', '${key}', '${opt.value}')">
              <img class="menu-img" src="${gImg(opt.menuId)}" alt="${opt.value}">
            </div>
          `).join('')}
        </div>
      `;
      if (cb) cb(selObj.value);
    }

    function toggleMenuDropdown(e, containerId) {
      e.stopPropagation();
      document.querySelectorAll('.menu-dd-list').forEach(l => {
        if (l.parentElement.id !== containerId) {
          l.classList.remove('open');
          const ic = l.parentElement.querySelector('.menu-toggle-icon');
          if (ic) ic.src = gImg(OPEN_MENU_ID);
        }
      });
      const list = document.querySelector(`#${containerId} .menu-dd-list`);
      const icon = document.querySelector(`#${containerId} .menu-toggle-icon`);
      list.classList.toggle('open');
      if (icon) icon.src = list.classList.contains('open') ? gImg(CLOSE_MENU_ID) : gImg(OPEN_MENU_ID);
    }

    function selectMenuDropdown(containerId, key, val) {
      saleModalState[key] = val;
      const map = { platform: MODAL_PLATFORMS, destination: MODAL_DESTINATIONS, courier: MODAL_COURIERS };
      renderMenuDropdown(containerId, key, map[key], val, key === 'platform' ? onSalePlatformChange : null);
    }

    function onSalePlatformChange(val) {
      const p = MODAL_PLATFORMS.find(x => x.value === val);
      if (p) document.getElementById('saleUserIcon').src = gImg(p.userId);
    }

    function previewSaleDoc(type, input) {
      if (!input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById(`txt_${type}`).style.display = 'none';
        const img = document.getElementById(`img_${type}`);
        img.src = reader.result;
        img.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    }

    async function handleSaleSubmit(e) {
      e.preventDefault();
      if (selectedSaleItems.size === 0) { alert("Vælg mindst én vare."); return; }

      const itemsToSell = Array.from(selectedSaleItems.values()).map(i => ({
        active_id: i.active_id, price: i.price
      }));

      const parcelBase64 = await fileToBase64(document.getElementById('parcelFile').files[0]);
      const labelBase64  = await fileToBase64(document.getElementById('labelFile').files[0]);
      const receiptBase64 = await fileToBase64(document.getElementById('receiptFile').files[0]);

      const orderPayload = {
        items: itemsToSell,
        date: document.getElementById('saleDate').value,
        platform: saleModalState.platform,
        name: document.getElementById('saleName').value,
        username: document.getElementById('saleUsername').value,
        destination: saleModalState.destination,
        courier: saleModalState.courier,
        tracking: document.getElementById('saleTracking').value,
        parcelBase64, labelBase64, receiptBase64
      };

      const btn = document.getElementById('saleSubmitBtn');
      btn.disabled = true;
      btn.innerText = 'Gemmer...';

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'processSale', order: orderPayload })
      });

      btn.disabled = false;
      btn.innerText = 'Gem ordre';
      closeModal('saleModal');
      loadItems();
    }

    function fileToBase64(file) {
      return new Promise((resolve) => {
        if (!file) { resolve(""); return; }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    window.onload = loadItems;
  </script>
</body>
</html>
