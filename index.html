<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktive Varer - Sam's Organizer</title>
  <style>
    :root {
      --bg-image: url('https://lh3.googleusercontent.com/d/1OCMi6ercH1tisFW6oVOidKwVX1rNS_Hn');
      --dd-height: 36px;
      --left-col-w: 59fr;
      --right-col-w: 97fr;
      --col-gap: 40.7px;
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111 var(--bg-image) no-repeat center center fixed;
      background-size: cover; color: #eee; padding: 20px;
      padding-top: 85px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 17, 17, 0.92);
      padding: 10px 20px;
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      gap: 15px;
      flex-wrap: nowrap;
    }

    .header-title-area h2 {
      font-size: 18px;
      white-space: nowrap;
    }

    .mobile-title { display: none; }

    header > .filter-bar-inline {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 550px;
      align-items: center;
    }

    header > .filter-bar-inline input#searchInput {
      padding: 6px 10px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 12px;
      flex: 1;
      height: 32px;
    }

    .dropdown-toggle-btn {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 0 12px;
      height: 32px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .dropdown-panel {
      display: none;
      position: fixed;
      top: 52px;
      right: 20px;
      background: #181818;
      border: 1px solid #555;
      width: 340px;
      max-height: 480px;
      overflow-y: auto;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      text-align: left !important;
    }
    .dropdown-panel.show { display: block; }
    .dropdown-header { font-size: 11px; font-weight: bold; color: #aaa; border-bottom: 1px solid #333; padding: 10px 12px; }
    .cat-item-row { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2a2a2a; color: #fff; background: #181818; width: 100%; }
    .cat-item-row:hover { background: #222; }
    .cat-left-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .cat-item-row input[type="checkbox"], .sub-item-row input[type="checkbox"] { width: 16px !important; height: 16px !important; accent-color: #fff; cursor: pointer; }
    .cat-name { flex: 1; font-weight: bold; }
    .count-badge { color: #888; font-weight: normal; font-size: 10px; margin-left: 4px; }
    .cat-arrow { color: #aaa; font-size: 10px; padding-left: 10px; }
    .sub-panel { display: none; background: #121212; border-bottom: 1px solid #2a2a2a; padding: 4px 0; width: 100%; }
    .sub-panel.show { display: block; }
    .sub-item-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 30px !important; font-size: 11px; color: #ddd; width: 100%; }
    .sub-item-row:hover { background: #1c1c1c; }
    .sub-name { flex: 1; color: #ccc; }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-btn {
      background: #fff; color: #111; padding: 7px 14px; border-radius: 0;
      text-decoration: none; font-weight: 600; font-size: 12px;
      cursor: pointer; border: none; display: inline-block; white-space: nowrap;
      height: 32px; line-height: 18px;
    }
    .nav-btn.btn-upload {
      background: #0062FF !important;
      color: #fff !important;
    }

    .mobile-search-dropdown {
      display: none;
      position: fixed;
      top: 50px;
      left: 0;
      width: 100%;
      background: rgba(17,17,17,0.95);
      padding: 8px 12px;
      z-index: 999;
      border-bottom: 1px solid #333;
    }
    .mobile-search-dropdown.show { display: block; }
    .mobile-search-dropdown input {
      width: 100%;
      padding: 8px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      font-size: 12px;
    }

    .mobile-action-icons { display: none; gap: 6px; align-items: center; }
    .mobile-icon-btn {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 2px;
    }
    .mobile-icon-btn svg { width: 16px; height: 16px; stroke: #fff; }

    .grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-top: 15px;
    }
    @media (max-width: 1450px) { .grid { grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 1250px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 650px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

    @media (max-width: 768px) {
      body { padding: 10px; padding-top: 55px; }
      header {
        padding: 6px 10px;
        height: 50px;
      }
      .desktop-title { display: none; }
      .mobile-title {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        line-height: 1.1;
      }
      .filter-bar-inline { display: none !important; }
      .header-buttons { gap: 4px; }
      .nav-btn {
        padding: 4px 8px;
        font-size: 11px;
        height: 28px;
        line-height: 18px;
      }
      .mobile-action-icons { display: flex; }
      .dropdown-panel {
        top: 50px;
        left: 0;
        right: 0;
        width: 100vw;
        max-height: calc(100vh - 50px);
        border-left: none;
        border-right: none;
      }
    }

    .item-card {
      background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid #333; position: relative; z-index: 1;
    }
    .image-container { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; overflow: hidden; }
    .image-container > img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(80%); cursor: zoom-in; }
    .card-btn {
      position: absolute; top: 6px; width: 26px; height: 26px; border: none;
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; z-index: 10; background: transparent;
    }
    .card-btn img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9)); }
    .btn-edit { left: 6px; }
    .btn-sell { right: 6px; }
    .info-box {
      background: #ffffff; color: #222; padding: 10px; font-size: 11px;
      display: flex; flex-direction: column; gap: 6px; flex-grow: 1; justify-content: space-between;
    }
    .info-title { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-meta { color: #666; font-size: 10px; display: flex; justify-content: space-between; }
    .platform-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 0;
      margin-top: 4px; border-top: 1px solid #eee; width: 100%; background: #fff;
    }
    .platform-icon-btn {
      background: transparent; border: none; cursor: pointer; padding: 0; margin: 0;
      display: flex; align-items: center; justify-content: center; width: 100%; height: 28px;
    }
    .platform-icon-btn img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      filter: grayscale(100%) opacity(35%); transition: filter 0.2s;
    }
    .platform-icon-btn.active img { filter: grayscale(0%) opacity(100%); }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 99999;
      align-items: center; justify-content: center; padding: 10px;
      overflow-y: auto;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: #fff; color: #222; padding: 20px 25px;
      width: 100%; max-width: 750px; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; margin: auto;
      border-radius: 4px; position: relative;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 8px; width: 100%; }

    /* DESKTOP VAREVÆLGER */
    .bundle-picker-box {
      display: grid; grid-template-columns: 200px 165px 1fr; gap: 6px;
      background: transparent; border: none; padding: 0; margin-bottom: 12px; 
      height: 170px; width: 100%; flex-shrink: 0;
    }
    .modal-col { border: 1px solid #ccc; padding: 4px; overflow-y: auto; height: 100%; display: flex; flex-direction: column; gap: 2px; background: #fff; }
    .modal-cat-header {
      font-size: 11px; font-weight: 700; padding: 5px 6px; cursor: pointer; color: #111; background: #f1f5f9;
      display: flex; justify-content: space-between; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-cat-header:hover, .modal-cat-header.active { background: #e2e8f0; color: #0062FF; }
    .modal-sub-item {
      font-size: 10.5px; padding: 5px 6px; cursor: pointer; color: #444; border-bottom: 1px solid #eee;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-sub-item:hover, .modal-sub-item.active { background: #0062FF; color: #fff; font-weight: 600; }
    .modal-item-row {
      display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e2e8f0; padding: 4px 6px; cursor: pointer; margin-bottom: 3px;
    }
    .modal-item-row:hover { background: #f8fafc; }
    .modal-item-row.selected { border-color: #0062FF; background: #eff6ff; }
    .modal-item-left { display: flex; align-items: center; gap: 6px; font-size: 10.5px; overflow: hidden; flex: 1; }
    .modal-item-left img { width: 28px; height: 36px; object-fit: cover; background: #000; flex-shrink: 0; }
    
    .selected-strip {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px 0; background: transparent; border: none; margin-bottom: 12px; min-height: 82px; align-items: center; width: 100%; flex-shrink: 0;
    }
    .selected-card {
      position: relative; width: 68px; background: #fff; border: 1px solid #94a3b8; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 4px;
    }
    .selected-card img { width: 44px; height: 56px; object-fit: cover; background: #000; }
    .selected-card input { width: 58px; font-size: 10px; padding: 2px; margin-top: 3px; text-align: center; border: 1px solid #ccc; }
    .selected-remove { position: absolute; top: 1px; right: 3px; color: #dc2626; font-weight: bold; font-size: 13px; cursor: pointer; line-height: 1; }
    
    .modal-rows-table { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 12px; position: relative; }
    .modal-pair-row { display: grid; grid-template-columns: var(--left-col-w) var(--right-col-w); gap: var(--col-gap); align-items: end; width: 100%; }
    .form-col-left, .form-col-right, .form-group { display: flex; flex-direction: column; gap: 3px; width: 100%; position: relative; }
    .form-group label { font-size: 11px; font-weight: 600; color: #333; }
    .form-group input, .form-group select { height: var(--dd-height); padding: 4px 8px; border: 1px solid #ccc; font-size: 12px; background: #fff; width: 100%; }
    .date-input-wrap { position: relative; display: flex; align-items: center; width: 100%; }
    .date-input-wrap input { width: 100% !important; padding-right: 28px; height: var(--dd-height); }
    .calendar-icon-btn {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center; z-index: 10; width: 22px; height: 22px;
    }
    .calendar-icon-btn img { width: 14px; height: 14px; object-fit: contain; }
    .hidden-date-picker { position: absolute; right: 0; top: 0; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
    
    .menu-dd { position: relative; display: block; width: 100%; }
    .menu-dd-btn {
      position: relative; height: var(--dd-height); display: flex; align-items: center; cursor: pointer; border: 1px solid #ccc; background: #fff; padding: 0; overflow: hidden; width: 100%;
    }
    .menu-dd-btn img.menu-img { height: var(--dd-height); width: 100%; object-fit: fill; display: block; }
    .menu-dd-btn img.menu-toggle-icon {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%); height: 14px; width: 14px; object-fit: contain; pointer-events: none; z-index: 10; background: transparent !important;
    }
    
    /* ÆNDRING: Menuerne åbner nu OPAD (bottom: 100% i stedet for top: 100%) */
    .menu-dd-list {
      display: none; position: absolute; bottom: 100%; left: 0; margin-bottom: 2px; background: #fff; border: 1px solid #999; border-bottom: none; max-height: none; overflow-y: visible; z-index: 99999; box-shadow: 0 -6px 16px rgba(0,0,0,0.25); width: 100%;
    }
    .menu-dd-list.open { display: block; }
    .menu-dd-opt { height: var(--dd-height); display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #eee; background: #fff; padding: 0; overflow: hidden; width: 100%; }
    .menu-dd-opt:hover { filter: brightness(0.92); }
    .menu-dd-opt img.menu-img { height: var(--dd-height); width: 100%; object-fit: fill; display: block; }
    
    .modal-bottom-actions { display: flex; justify-content: space-between; align-items: center; margin: 0; width: 100%; padding: 0; flex-shrink: 0; }
    .modal-bottom-actions .nav-btn { height: 28px; padding: 0 12px; font-size: 11px; display: flex; align-items: center; justify-content: center; margin: 0; }
    #saleCancelBtn { width: 74.4px; }
    #saleSubmitBtn { width: 85.3px; }
    .standard-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin: 10px 0 0 0; width: 100%; }
    .standard-modal-actions .nav-btn { height: 28px; padding: 0 12px; font-size: 11px; margin: 0; }

    /* MOBIL-SPECIFIKT LAYOUT FOR 'MARKER SOM SOLGT' MODAL */
    @media (max-width: 768px) {
      #saleModal { padding: 6px; }
      #saleModal .modal-card {
        padding: 12px 10px;
        max-height: 96vh;
        width: 100%;
        overflow-x: hidden;
      }
      #saleModal .bundle-picker-box {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-content: flex-start;
        row-gap: 6px;
        column-gap: 0;
        background: transparent;
        border: none;
        padding: 0;
        height: auto;
        margin: 0 auto 8px auto;
        width: 100%;
      }
      #saleModal #colCategories {
        width: 63.66%;
        height: 33.75vw;
        max-height: 145px;
        min-height: 115px;
        border: 1px solid #333;
        padding: 0;
        background: #fff;
      }
      #saleModal #colSubcategories {
        width: 32.39%;
        height: 33.75vw;
        max-height: 145px;
        min-height: 115px;
        border: 1px solid #333;
        padding: 0;
        background: #fff;
      }
      #saleModal #colItems {
        width: 100%;
        margin: 0;
        height: 31.96vw;
        max-height: 135px;
        min-height: 105px;
        border: 1px solid #333;
        padding: 3px;
        background: #fff;
      }
      #saleModal .modal-cat-header {
        font-size: 10px;
        padding: 4px 5px;
        border-bottom: 1px solid #d1d5db;
      }
      #saleModal .modal-sub-item {
        font-size: 9.5px;
        padding: 4px 5px;
      }
      #saleModal .modal-item-row {
        padding: 3px 5px;
        margin-bottom: 3px;
      }
      #saleModal .modal-item-left {
        font-size: 9.5px;
        line-height: 1.2;
      }
      #saleModal .modal-item-left img {
        width: 22px;
        height: 28px;
      }

      #saleModal .selected-strip-label {
        width: 100%;
        margin: 0 auto 4px auto;
      }
      #saleModal .selected-strip {
        background: transparent !important;
        border: none !important;
        padding: 2px 0 8px 0 !important;
        margin-right: 0;
        width: 100%;
        min-height: 82px;
        gap: 8px;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      #saleModal .selected-card {
        width: 68px;
        flex-shrink: 0;
        border: 1px solid #94a3b8;
        padding: 4px;
        background: #fff;
      }
      #saleModal .selected-card img {
        width: 44px;
        height: 56px;
      }
      #saleModal .selected-card input {
        width: 58px;
        font-size: 10px;
        padding: 2px;
        margin-top: 3px;
      }

      #saleModal .modal-rows-table {
        gap: 8px;
        margin: 0 auto 12px auto;
        width: 100%;
      }
      #saleModal .modal-pair-row {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        gap: 0;
      }
      #saleModal .form-col-left {
        width: 46% !important;
        flex-shrink: 0;
      }
      #saleModal .form-col-right {
        width: 50% !important;
        flex-shrink: 0;
      }
      #saleModal .form-group {
        width: 100% !important;
      }
      #saleModal .form-group input,
      #saleModal .date-input-wrap,
      #saleModal .menu-dd,
      #saleModal .form-group select {
        width: 100% !important;
      }
      #saleModal .form-group input,
      #saleModal .date-input-wrap input,
      #saleModal .menu-dd-btn,
      #saleModal .menu-dd-btn img.menu-img,
      #saleModal .menu-dd-opt,
      #saleModal .menu-dd-opt img.menu-img {
        height: 8.57vw !important;
        min-height: 30px;
        max-height: 36px;
        width: 100% !important;
        box-sizing: border-box !important;
      }
      #saleModal .form-group input {
        font-size: 11px;
        padding: 2px 6px;
      }

      #saleModal .date-input-wrap {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100% !important;
      }
      #saleModal .date-input-wrap input {
        padding-right: 4px !important;
        flex: 1;
        min-width: 0;
        width: auto !important;
      }
      #saleModal .calendar-icon-btn {
        position: static !important;
        transform: none !important;
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      #saleModal .calendar-icon-btn img {
        width: 15px;
        height: 15px;
      }

      #saleModal .menu-dd {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100% !important;
      }
      #saleModal .menu-dd-btn {
        flex: 1;
        min-width: 0;
        width: auto !important;
      }
      #saleModal .external-dd-toggle {
        width: 16px;
        height: 16px;
        cursor: pointer;
        flex-shrink: 0;
        object-fit: contain;
        display: block !important;
      }
      #saleModal .menu-dd-btn img.menu-toggle-icon {
        display: none !important;
      }
      #saleModal .menu-dd-list {
        width: calc(100% - 20px);
      }

      #saleModal .modal-bottom-actions {
        width: 100%;
        margin: 8px auto 0 auto;
      }
    }

    @media (min-width: 769px) {
      .external-dd-toggle { display: none !important; }
    }

    .lightbox-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); z-index: 999999;
      align-items: center; justify-content: center; cursor: zoom-out; padding: 20px;
    }
    .lightbox-overlay.show { display: flex; }
    .lightbox-overlay img {
      max-width: 94vw; max-height: 92vh; object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9); border: 1px solid #444;
    }
    .lightbox-close {
      position: fixed; top: 18px; right: 24px; color: #fff; font-size: 32px;
      font-weight: bold; cursor: pointer; line-height: 1; z-index: 1000000;
      background: rgba(0,0,0,0.5); width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title-area">
      <h2 class="desktop-title">Aktive Varer</h2>
      <span class="mobile-title">Aktive</span>
    </div>

    <div class="filter-bar-inline">
      <input type="text" id="searchInput" placeholder="Søg i titel, mærke, strørrelse, katategori, platform..." oninput="filterGrid()">
      <button class="dropdown-toggle-btn" id="desktopCatBtn" onclick="toggleCategoryMenu(event)">Vælg kategorier &or;</button>
    </div>

    <div class="header-buttons">
      <button class="nav-btn btn-upload" onclick="openUploadModal()">+ Upload</button>
      <a class="nav-btn" href="sold.html">Solgte &rarr;</a>
      <a class="nav-btn" href="purchased.html">Købte &rarr;</a>
      
      <div class="mobile-action-icons">
        <button class="mobile-icon-btn" onclick="toggleMobileSearch(event)" title="Søg">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="mobile-icon-btn" id="mobileCatBtn" onclick="toggleCategoryMenu(event)" title="Kategorier">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

    function sortItemsByCategoryOrder(items) {
      return items.slice().sort((a, b) => {
        const catA = String(a.category || '').trim().toLowerCase();
        const catB = String(b.category || '').trim().toLowerCase();
        const catIdxA = categoriesData.findIndex(c => c.name.toLowerCase() === catA);
        const catIdxB = categoriesData.findIndex(c => c.name.toLowerCase() === catB);

        const normCatA = catIdxA === -1 ? 999 : catIdxA;
        const normCatB = catIdxB === -1 ? 999 : catIdxB;
        if (normCatA !== normCatB) return normCatA - normCatB;

        if (catIdxA !== -1) {
          const subs = categoriesData[catIdxA].subs;
          const subA = String(a.subcategory || '').trim().toLowerCase();
          const subB = String(b.subcategory || '').trim().toLowerCase();
          const subIdxA = subs.findIndex(s => s.toLowerCase() === subA);
          const subIdxB = subs.findIndex(s => s.toLowerCase() === subB);

          const normSubA = subIdxA === -1 ? 999 : subIdxA;
          const normSubB = subIdxB === -1 ? 999 : subIdxB;
          if (normSubA !== normSubB) return normSubA - normSubB;
        }

        return Number(a.active_id || 0) - Number(b.active_id || 0);
      });
    }

    function normalizeDateInput(input) {
      let val = input.value.trim();
      if (!val) return;
      val = val.replace(/[-.]/g, '/');
      if (/^\d{8}$/.test(val)) val = `${val.slice(0,2)}/${val.slice(2,4)}/${val.slice(4)}`;
      let parts = val.split('/');
      if (parts.length === 3) {
        let d = parts[0].padStart(2, '0');
        let m = parts[1].padStart(2, '0');
        let y = parts[2];
        if (y.length === 2) y = '20' + y;
        input.value = `${d}/${m}/${y}`;
      }
    }

    }

    function onDatePicked(inputId, picker) {
      if (!picker.value) return;
      let parts = picker.value.split('-');
      if (parts.length === 3) document.getElementById(inputId).value = `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    async function loadItems() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=active", { redirect: "follow" });
        const text = await res.text();
        activeItems = sortItemsByCategoryOrder(JSON.parse(text));
        buildCategoryMenu();
        renderGrid(activeItems);
      } catch (err) {
        document.getElementById('itemsContainer').innerHTML = '<p>Fejl ved indlæsning af varer.</p>';
      }
    }

    window.addEventListener('click', function(event) {
      if (!event.target.closest('.dropdown-panel') && !event.target.closest('#desktopCatBtn') && !event.target.closest('#mobileCatBtn')) {
        const panel = document.getElementById('categoryDropdownPanel');
        if (panel) panel.classList.remove('show');
      }
      if (!event.target.closest('.mobile-search-dropdown') && !event.target.closest('.mobile-icon-btn')) {
        const sDrop = document.getElementById('mobileSearchDropdown');
        if (sDrop) sDrop.classList.remove('show');
      }
      if (!event.target.closest('.menu-dd')) {
        document.querySelectorAll('.menu-dd-list').forEach(l => l.classList.remove('open'));
        document.querySelectorAll('.menu-toggle-icon, .external-dd-toggle').forEach(i => i.src = gImg(OPEN_MENU_ID));
      }
    });

    function buildCategoryMenu() {
      const container = document.getElementById('categoryCheckboxesContainer');
      if (!container) return;
      container.innerHTML = categoriesData.map((cat, cIdx) => {
        const catCount = activeItems.filter(i => String(i.category || '').trim().toLowerCase() === cat.name.toLowerCase()).length;
        return `
          <div>
            <div class="cat-item-row" onclick="toggleSubPanel(${cIdx})">
              <div class="cat-left-group">
                <input type="checkbox" class="cat-cb" value="${cat.name}" onchange="filterGrid()" onclick="event.stopPropagation()">
                <div class="cat-name">${cat.name} <span class="count-badge">(${catCount})</span></div>
              </div>
              <div class="cat-arrow" id="arrow_${cIdx}">▼</div>
            </div>
            <div class="sub-panel" id="subPanel_${cIdx}">
              ${cat.subs.map(sub => {
                const subCount = activeItems.filter(i =>
                  String(i.category || '').trim().toLowerCase() === cat.name.toLowerCase() &&
                  String(i.subcategory || '').trim().toLowerCase() === sub.toLowerCase()
                ).length;
                return `
                  <div class="sub-item-row" onclick="event.stopPropagation()">
                    <input type="checkbox" class="sub-cb" data-category="${cat.name}" value="${sub}" onchange="filterGrid()">
                    <div class="sub-name">${sub} <span class="count-badge">(${subCount})</span></div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleSubPanel(idx) {
      const panel = document.getElementById(`subPanel_${idx}`);
      const arrow = document.getElementById(`arrow_${idx}`);
      if (panel) panel.classList.toggle('show');
      if (arrow) arrow.innerText = panel && panel.classList.contains('show') ? '▲' : '▼';
    }

    function filterGrid() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const selectedCats = Array.from(document.querySelectorAll('.cat-cb:checked')).map(cb => cb.value);
      const selectedSubs = Array.from(document.querySelectorAll('.sub-cb:checked')).map(cb => cb.value);

      const filtered = activeItems.filter(item => {
        const matchesCat = selectedCats.length === 0 || selectedCats.includes(item.category);
        const matchesSub = selectedSubs.length === 0 || selectedSubs.includes(item.subcategory);
        let matchesQuery = true;
        if (q) {
          const searchable = `${item.title} ${item.brand} ${item.size} ${item.category} ${item.subcategory} #${item.active_id}`.toLowerCase();
          matchesQuery = searchable.includes(q);
        }
        return matchesCat && matchesSub && matchesQuery;
      });
      renderGrid(sortItemsByCategoryOrder(filtered));
    }

    function renderGrid(items) {
      const container = document.getElementById('itemsContainer');
      if (!items || items.length === 0) {
        container.innerHTML = '<p>Ingen aktive varer fundet.</p>';
        return;
      }
      container.innerHTML = items.map(item => {
        const imgSource = item.image_id ? gImg(item.image_id) : '';
        return `
          <div class="item-card">
            <div class="image-container">
              <button class="card-btn btn-edit" title="Rediger vare" onclick="openEditActiveModal(${item.active_id})">
                <img src="${gImg(EDIT_ICON_ID)}" alt="Rediger">
              </button>
              <button class="card-btn btn-sell" title="Marker som solgt" onclick="openSaleModalFor(${item.active_id})">
                <img src="${gImg(SOLD_ICON_ID)}" alt="Solgt">
              </button>
              ${imgSource ? `<img src="${imgSource}" alt="${item.title}" onclick="openLightbox('${imgSource}')">` : '<div style="color:#777; text-align:center; padding-top:100px;">Mangler</div>'}
            </div>
            <div class="info-box">
              <div>
                <div class="info-title">${item.title}</div>
                <div class="info-meta">
                  <span>${item.brand || ''}</span>
                  <span>Str. ${item.size || '-'}</span>
                  <span>#${item.active_id}</span>
                </div>
              </div>
              <div class="platform-grid">
                ${platformMeta.map(p => `
                  <button class="platform-icon-btn ${item[p.key] ? 'active' : ''}" title="${p.name}" onclick="togglePlatform(${item.active_id}, '${p.key}', ${!item[p.key]})">
                    <img src="https://lh3.googleusercontent.com/d/${p.id}" alt="${p.name}">
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function togglePlatform(id, field, value) {
      const item = activeItems.find(i => i.active_id === id);
      if (item) item[field] = value;
      filterGrid();
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateActiveState', active_id: id, field: field, value: value })
      });
    }

    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function openSaleModalFor(primaryId) {
      selectedSaleItems.clear();
      const initialItem = activeItems.find(i => String(i.active_id) === String(primaryId));
      if (initialItem) {
        selectedSaleItems.set(String(initialItem.active_id), { ...initialItem, price: "0,00 kr." });
        selectedModalCat = initialItem.category || categoriesData[0].name;
        selectedModalSub = initialItem.subcategory || "";
      } else {
        selectedModalCat = categoriesData[0].name;
        selectedModalSub = "";
      }

      renderSaleModalColumns();
      renderSelectedStrip();

      let now = new Date();
      document.getElementById('saleDate').value = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
      document.getElementById('saleUsername').value = '';
      document.getElementById('saleName').value = '';
      document.getElementById('saleTracking').value = '';

      renderMenuDropdown('dd_sale_platform', 'platform', getModalOptions('platform'), '', onSalePlatformChange);
      renderMenuDropdown('dd_sale_destination', 'destination', getModalOptions('destination'), '');
      renderMenuDropdown('dd_sale_courier', 'courier', getModalOptions('courier'), '');

      document.getElementById('saleModal').classList.add('show');
    }

    function renderSaleModalColumns() {
      const col1 = document.getElementById('colCategories');
      col1.innerHTML = categoriesData.map(cat => {
        const isAct = selectedModalCat === cat.name;
        const cnt = activeItems.filter(i => String(i.category || '').toLowerCase() === cat.name.toLowerCase()).length;
        return `<div class="modal-cat-header ${isAct ? 'active' : ''}" onclick="selectModalCat('${cat.name}')"><span>${cat.name} <span class="count-badge">(${cnt})</span></span><span>&rsaquo;</span></div>`;
      }).join('');

      const col2 = document.getElementById('colSubcategories');
      const activeCatObj = categoriesData.find(c => c.name === selectedModalCat) || categoriesData[0];
      col2.innerHTML = activeCatObj.subs.map(sub => {
        const isActSub = selectedModalSub === sub;
        const cnt = activeItems.filter(i =>
          String(i.category || '').toLowerCase() === activeCatObj.name.toLowerCase() &&
          String(i.subcategory || '').toLowerCase() === sub.toLowerCase()
        ).length;
        return `<div class="modal-sub-item ${isActSub ? 'active' : ''}" onclick="selectModalSub('${sub}')">${sub} <span class="count-badge">(${cnt})</span></div>`;
      }).join('');

      const col3 = document.getElementById('colItems');
      const filteredItems = activeItems.filter(item => {
        if (selectedModalSub) return String(item.subcategory || '').toLowerCase() === selectedModalSub.toLowerCase();
        return String(item.category || '').toLowerCase() === selectedModalCat.toLowerCase();
      });

      if (filteredItems.length === 0) {
        col3.innerHTML = `<div style="padding:8px; font-size:10.5px; color:#666;">Ingen varer.</div>`;
        return;
      }

      col3.innerHTML = filteredItems.map(item => {
        const isSel = selectedSaleItems.has(String(item.active_id));
        const thumb = item.image_id ? gImg(item.image_id) : '';
        return `
          <div class="modal-item-row ${isSel ? 'selected' : ''}" onclick="toggleSelectSaleItem('${item.active_id}')">
            <div class="modal-item-left">
              ${thumb ? `<img src="${thumb}">` : '<div style="width:28px;height:36px;background:#333;"></div>'}
              <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">
                <b>${item.title}</b><br>
                <span style="font-size:9.5px; color:#666;">${item.brand ? item.brand + ' &nbsp; ' : ''}Str. ${item.size || '-'}</span>
              </div>
            </div>
            <span style="font-weight:bold; font-size:12px; color:${isSel ? '#0062FF' : '#999'}; margin-left:4px;">${isSel ? '✓' : '+'}</span>
          </div>
        `;
      }).join('');
    }

    function selectModalCat(catName) { selectedModalCat = catName; selectedModalSub = ""; renderSaleModalColumns(); }
    function selectModalSub(subName) { selectedModalSub = subName; renderSaleModalColumns(); }

    function toggleSelectSaleItem(id) {
      const sId = String(id);
      if (selectedSaleItems.has(sId)) selectedSaleItems.delete(sId);
      else {
        const found = activeItems.find(i => String(i.active_id) === sId);
        if (found) selectedSaleItems.set(sId, { ...found, price: "0,00 kr." });
      }
      renderSaleModalColumns();
      renderSelectedStrip();
    }

    function renderSelectedStrip() {
      const strip = document.getElementById('selectedBundleStrip');
      const arr = Array.from(selectedSaleItems.values());
      if (arr.length === 0) {
        strip.innerHTML = '<span style="font-size:11px; color:#666;">Ingen varer valgt endnu.</span>';
        document.getElementById('saleOrderTotal').value = "= 0,00 kr.";
        return;
      }
      strip.innerHTML = arr.map(item => `
        <div class="selected-card">
          <span class="selected-remove" onclick="toggleSelectSaleItem('${item.active_id}')">&times;</span>
          <img src="${item.image_id ? gImg(item.image_id) : ''}" alt="">
          <input type="text" value="${item.price}" onchange="updateSaleItemPrice('${item.active_id}', this.value)">
        </div>
      `).join('');

      let total = 0;
      arr.forEach(i => {
        let clean = String(i.price || "0").replace(/kr\.?/gi, "").replace(/\./g, "").replace(",", ".").trim();
        let num = parseFloat(clean);
        if (!isNaN(num)) total += num;
      });
      document.getElementById('saleOrderTotal').value = `= ${total.toFixed(2).replace(".", ",")} kr.`;
    }

    function updateSaleItemPrice(id, val) {
      const item = selectedSaleItems.get(String(id));
      if (item) {
        let cleaned = String(val).replace(/kr\.?/gi, "").trim();
        if (cleaned.includes(",") && cleaned.includes(".")) cleaned = cleaned.replace(/\./g, "").replace(",", ".");
        else if (cleaned.includes(",")) cleaned = cleaned.replace(",", ".");
        let num = parseFloat(cleaned);
        item.price = !isNaN(num) ? `${num.toFixed(2).replace(".", ",")} kr.` : `${cleaned} kr.`;
        renderSelectedStrip();
      }
    }

    function renderMenuDropdown(containerId, key, options, selectedVal, cb) {
      const container = document.getElementById(containerId);
      const selObj = (selectedVal && selectedVal.trim() !== "") ? options.find(o => o.value.toLowerCase() === String(selectedVal).trim().toLowerCase()) : null;
      saleModalState[key] = selObj ? selObj.value : "";

      container.innerHTML = `
        <div class="menu-dd-btn" onclick="toggleMenuDropdown(event, '${containerId}')">
          ${selObj ? `<img class="menu-img" src="${gImg(selObj.menuId)}" alt="${selObj.value}">` : ''}
          <img class="menu-toggle-icon" src="${gImg(OPEN_MENU_ID)}" alt="">
        </div>
        <img class="external-dd-toggle" src="${gImg(OPEN_MENU_ID)}" alt="" onclick="toggleMenuDropdown(event, '${containerId}')">
        <div class="menu-dd-list">
          <div class="menu-dd-opt" onclick="selectMenuDropdown('${containerId}', '${key}', '')"></div>
          ${options.map(opt => `
            <div class="menu-dd-opt" onclick="selectMenuDropdown('${containerId}', '${key}', '${opt.value}')">
              <img class="menu-img" src="${gImg(opt.menuId)}" alt="${opt.value}">
            </div>
          `).join('')}
        </div>
      `;
      if (cb) cb(saleModalState[key]);
    }

    function toggleMenuDropdown(e, containerId) {
      e.stopPropagation();
      document.querySelectorAll('.menu-dd-list').forEach(l => {
        if (l.parentElement.id !== containerId) {
          l.classList.remove('open');
          l.parentElement.querySelectorAll('.menu-toggle-icon, .external-dd-toggle').forEach(ic => ic.src = gImg(OPEN_MENU_ID));
        }
      });
      const list = document.querySelector(`#${containerId} .menu-dd-list`);
      const icons = document.querySelectorAll(`#${containerId} .menu-toggle-icon, #${containerId} .external-dd-toggle`);
      list.classList.toggle('open');
      const nextSrc = list.classList.contains('open') ? gImg(CLOSE_MENU_ID) : gImg(OPEN_MENU_ID);
      icons.forEach(ic => ic.src = nextSrc);
    }

    function selectMenuDropdown(containerId, key, val) {
      saleModalState[key] = val;
      renderMenuDropdown(containerId, key, getModalOptions(key), val, key === 'platform' ? onSalePlatformChange : null);
    }

    function onSalePlatformChange(val) {}

    async function handleSaleSubmit(e) {
      e.preventDefault();
      if (selectedSaleItems.size === 0) { alert("Vælg mindst én vare."); return; }

      const itemsToSell = Array.from(selectedSaleItems.values()).map(i => ({
        active_id: i.active_id, price: i.price
      }));

      const orderPayload = {
        items: itemsToSell,
        date: document.getElementById('saleDate').value,
        platform: saleModalState.platform || "",
        name: document.getElementById('saleName').value,
        username: document.getElementById('saleUsername').value,
        destination: saleModalState.destination || "",
        courier: saleModalState.courier || "",
        tracking: document.getElementById('saleTracking').value,
        packagingBase64: "",
        labelBase64: "",
        receiptBase64: ""
      };

      const btn = document.getElementById('saleSubmitBtn');
      btn.disabled = true;
      btn.innerText = 'Gemmer...';

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'processSale', order: orderPayload })
      });

      btn.disabled = false;
      btn.innerText = 'Gem ordre';
      closeModal('saleModal');
      loadItems();
    }

    function fileToBase64(file) {
      return new Promise((resolve) => {
        if (!file) { resolve(""); return; }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    window.onload = loadItems;
  </script>
</body>
</html>
