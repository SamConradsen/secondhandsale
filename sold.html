<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solgte Varer - Sam's Organizer</title>
  <style>
    :root {
      --bg-image: url('https://lh3.googleusercontent.com/d/1OCMi6ercH1tisFW6oVOidKwVX1rNS_Hn');
      --dd-height: 30px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111 var(--bg-image) no-repeat center center fixed;
      background-size: cover; color: #eee; padding: 20px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; background: rgba(0,0,0,0.6); padding: 15px 20px;
      backdrop-filter: blur(8px);
    }
    .nav-btn {
      background: #fff; color: #111; padding: 8px 16px; border-radius: 0;
      text-decoration: none; font-weight: 600; font-size: 13px; margin-left: 10px;
      cursor: pointer; border: none; display: inline-block;
    }

    .top-actions-bar {
      display: flex; justify-content: flex-end; margin-bottom: 20px; position: relative; z-index: 50;
    }
    .platform-dropdown-wrap { position: relative; display: inline-block; }
    .platform-toggle-btn {
      background: transparent; border: none; padding: 0; cursor: pointer; display: flex; align-items: center;
    }
    .platform-toggle-btn img { height: 26px; width: auto; object-fit: contain; display: block; }

    .platform-dropdown-panel {
      display: none; position: absolute; top: 100%; right: 0; background: #1a1a1a;
      border: 1px solid #444; padding: 6px; width: max-content;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9); z-index: 999;
      flex-direction: column; gap: 4px;
    }
    .platform-dropdown-panel.show { display: flex; }
    .filter-plat-btn {
      background: transparent; border: none; padding: 0; cursor: pointer;
      height: 26px; display: block; width: auto;
    }
    .filter-plat-btn img { height: 100%; width: auto; display: block; }
    .filter-plat-btn.off img { filter: brightness(35%) grayscale(85%); opacity: 0.6; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }
    @media (max-width: 1450px) { .grid { grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 1250px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 650px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

    .item-card {
      background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); position: relative; border: 1px solid #333;
    }
    .image-container { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; overflow: hidden; }
    .image-container > img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(80%); }

    .corner-edit-btn {
      position: absolute; top: 6px; left: 6px; background: transparent; border: none; padding: 0; cursor: pointer; z-index: 10;
    }
    .corner-edit-btn img { width: 22px; height: 22px; object-fit: contain; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9)); }

    .order-overlay-label {
      position: absolute; bottom: 0; right: 0; background: #000; color: #fff;
      font-size: 9px; font-weight: 800; padding: 3px 7px; text-align: right; z-index: 10;
    }
    .order-overlay-label.is-bundle { left: 0; width: 100%; }

    .platform-banner { width: 100%; background: #fff; display: block; line-height: 0; border-bottom: 1px solid #eee; }
    .platform-banner img { width: 100%; height: auto; display: block; }

    .info-box {
      background: #ffffff; color: #222; padding: 8px 10px 10px 10px; font-size: 11px;
      display: flex; flex-direction: column; gap: 6px; flex-grow: 1; justify-content: space-between;
    }
    .info-title {
      font-weight: 700; font-size: 12px; color: #111;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-bottom: 5px; border-bottom: 1px solid #e5e5e5;
    }

    .date-price-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; }
    .sale-date-text { color: #888; }
    .sale-price-text { color: #111; font-weight: 700; font-size: 11px; }

    .buyer-info-block { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
    .icon-text-row { display: flex; align-items: center; gap: 5px; }
    .icon-text-row img.mini-icon { width: 13px; height: 13px; object-fit: contain; flex-shrink: 0; }
    .buyer-username-text { font-weight: 700; font-size: 11px; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .buyer-name-text { font-weight: 400; font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .shipping-route-row {
      display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-top: 3px; width: 100%;
    }
    .shipping-badge-wrap { flex: 1; min-width: 0; }
    .shipping-badge-wrap img { width: 100%; height: auto; display: block; border: 1px solid #696969; }
    .arrow-sep-img { width: 12px; height: 12px; object-fit: contain; flex-shrink: 0; }

    .tracking-row { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 2px; }
    .tracking-btn { background: transparent; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; }
    .tracking-btn img { width: 14px; height: 14px; object-fit: contain; display: block; }
    .tracking-text { font-family: monospace; font-size: 9.5px; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .bottom-status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #eee;
      width: 100%;
    }
    .pay-badge-wrap { flex: 241; min-width: 0; }
    .stat-badge-wrap { flex: 352; min-width: 0; }
    .pay-badge-wrap img, .stat-badge-wrap img {
      width: 100%; height: auto; display: block; border: 1px solid #696969;
    }

    /* MODAL */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(5px); z-index: 99999;
      align-items: center; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
    .bundle-nav-arrow {
      background: rgba(255,255,255,0.92); color: #111; border: 1px solid #ccc; width: 32px; height: 52px;
      font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; flex-shrink: 0;
    }
    .bundle-nav-arrow.hidden { visibility: hidden; pointer-events: none; }

    .modal-card {
      background: #fff; color: #222; padding: 20px 30px;
      width: max-content; max-width: 95vw; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; align-items: center;
      margin: auto;
    }
    .modal-item-header { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid #e5e5e5; width: 100%; }
    .modal-item-header img { width: 48px; height: 62px; object-fit: cover; background: #000; border: 1px solid #ddd; flex-shrink: 0; }
    .modal-header-text h3 { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 2px; }
    .modal-header-text span { font-size: 10.5px; color: #666; }

    .modal-rows-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      margin: 0 auto 12px auto;
      width: max-content;
    }
    .modal-pair-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
      width: 100%;
    }
    @media (max-width: 600px) {
      .modal-pair-row { flex-direction: column; width: 100%; align-items: stretch; }
    }

    .form-col-left { display: flex; flex-direction: column; gap: 3px; width: max-content; }
    .form-col-right { display: flex; flex-direction: column; gap: 3px; width: max-content; }

    .form-group { display: flex; flex-direction: column; gap: 3px; width: max-content; }
    .form-group label { font-size: 11px; font-weight: 600; color: #333; }
    .form-group input { height: var(--dd-height); padding: 4px 8px; border: 1px solid #ccc; font-size: 12px; background: #fff; }

    /* SALGSDATO FLETET MATCHER VENSTRE KOLONNE NØJAGTIGT UTEN AT BLIVE FORBREDE */
    .date-input-wrap { position: relative; display: flex; align-items: center; width: max-content; }
    .calendar-icon-btn {
      position: absolute; right: 6px; background: transparent; border: none; cursor: pointer; padding: 0; display: flex; align-items: center;
    }
    .calendar-icon-btn img { width: 16px; height: 16px; object-fit: contain; }
    .hidden-date-picker { position: absolute; right: 0; top: 0; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

    /* MENU-OG-BILLEDER FASTGJORT TÆT UTEN TOMRUM */
    .menu-dd {
      position: relative;
      display: inline-block;
      width: max-content;
    }
    .menu-dd-btn {
      position: relative;
      height: var(--dd-height);
      display: flex;
      align-items: center;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      padding: 0 24px 0 0;
      overflow: hidden;
      width: max-content;
    }
    .menu-dd-btn img.menu-img {
      height: var(--dd-height);
      width: auto;
      max-width: none;
      object-fit: contain;
      object-position: left center;
      display: block;
    }
    .menu-dd-btn img.menu-toggle-icon {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      height: 14px;
      width: 14px;
      object-fit: contain;
      pointer-events: none;
      z-index: 10;
      background: transparent !important;
    }
    .menu-dd-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      border: 1px solid #999;
      border-top: none;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      width: max-content;
    }
    .menu-dd-list.open { display: block; }
    .menu-dd-opt {
      height: var(--dd-height);
      display: flex;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      background: #fff;
      padding: 0;
      overflow: hidden;
      width: max-content;
    }
    .menu-dd-opt:hover { filter: brightness(0.92); }
    .menu-dd-opt img.menu-img {
      height: var(--dd-height);
      width: auto;
      object-fit: contain;
      object-position: left center;
      display: block;
    }

    .doc-upload-grid {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 6px auto 0 auto;
      width: max-content;
    }
    .doc-col { display: flex; flex-direction: column; align-items: center; width: 100px; }
    .doc-col label { font-size: 11px; font-weight: 600; color: #333; margin-bottom: 3px; }
    .doc-square {
      position: relative; width: 100px; height: 100px; background: #f9f9f9; border: 1px solid #ccc;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .doc-square img.doc-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .doc-edit-mini-btn { position: absolute; top: 3px; left: 3px; background: rgba(0,0,0,0.75); color: #fff; border: none; font-size: 8.5px; padding: 2px 4px; cursor: pointer; z-index: 5; }

    .modal-bottom-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: -32px auto 0 auto;
      position: relative;
      z-index: 20;
      pointer-events: none;
      width: 100%;
      max-width: 520px;
    }
    .modal-bottom-actions button { pointer-events: auto; }
  </style>
</head>
<body>

  <header>
    <h2>Solgte Varer</h2>
    <a class="nav-btn" href="index.html">&larr; Aktive Varer</a>
  </header>

  <div class="top-actions-bar">
    <div class="platform-dropdown-wrap" id="platformDropdownWrap">
      <button type="button" class="platform-toggle-btn" onclick="togglePlatformDropdown(event)" title="Vis/skjul platforme">
        <img src="https://lh3.googleusercontent.com/d/1vui8-H7jr2UiyUe3wYghdiucY5iO292U" alt="Menu">
      </button>
      <div class="platform-dropdown-panel" id="platformDropdownPanel">
        <div id="platformFilterButtons"></div>
      </div>
    </div>
  </div>

  <div class="grid" id="soldContainer">Indlæser solgte varer...</div>

  <!-- EDIT SOLD MODAL -->
  <div class="modal" id="soldEditModal" onclick="if(event.target === this) closeSoldEditModal()">
    <div class="modal-wrapper">
      <button type="button" class="bundle-nav-arrow hidden" id="prevBundleItemBtn" onclick="navigateBundleItem(-1)">&lt;</button>
      
      <div class="modal-card">
        <div class="modal-item-header">
          <img id="soldModalItemImg" src="" alt="">
          <div class="modal-header-text">
            <h3 id="soldModalItemTitle">Varetitel</h3>
            <span id="soldModalOrderMeta">ORDRE #000</span>
          </div>
        </div>

        <form id="soldEditForm" onsubmit="handleSoldEditSave(event)" style="width: 100%;">
          <div class="modal-rows-table">
            <!-- RÆKKE 1 -->
            <div class="modal-pair-row">
              <div class="form-col-left">
                <div class="form-group">
                  <label>Salgsdato:</label>
                  <div class="date-input-wrap">
                    <input type="text" id="soldEditDate" placeholder="DD/MM/ÅÅÅÅ" onblur="normalizeDateInput(this)">
                    <button type="button" class="calendar-icon-btn" onclick="openDatePicker('soldEditDate')">
                      <img src="https://lh3.googleusercontent.com/d/1yqZLSEHqQy4xJCpfjSLR5ba2yF6g36Fr" alt="Kalender">
                    </button>
                    <input type="date" id="soldEditDateHiddenPicker" class="hidden-date-picker" onchange="onDatePicked('soldEditDate', this)">
                  </div>
                </div>
              </div>
              <div class="form-col-right">
                <div style="display:flex; gap:6px;">
                  <div class="form-group">
                    <label>Varens pris:</label>
                    <input type="text" id="soldEditPrice" onblur="formatPriceFieldOnBlur()">
                  </div>
                  <div class="form-group">
                    <label>Ordre total:</label>
                    <input type="text" id="soldEditOrderTotal" readonly style="background:#f1f5f9; font-weight:700;">
                  </div>
                </div>
              </div>
            </div>

            <!-- RÆKKE 2 -->
            <div class="modal-pair-row">
              <div class="form-col-left">
                <div class="form-group">
                  <label>Platform:</label>
                  <div class="menu-dd" id="dd_platform"></div>
                </div>
              </div>
              <div class="form-col-right">
                <div class="form-group">
                  <label>Brugernavn:</label>
                  <input type="text" id="soldEditUsername">
                </div>
              </div>
            </div>

            <!-- RÆKKE 3 -->
            <div class="modal-pair-row">
              <div class="form-col-left">
                <div class="form-group">
                  <label>Destination:</label>
                  <div class="menu-dd" id="dd_destination"></div>
                </div>
              </div>
              <div class="form-col-right">
                <div class="form-group">
                  <label>Navn:</label>
                  <input type="text" id="soldEditName">
                </div>
              </div>
            </div>

            <!-- RÆKKE 4 -->
            <div class="modal-pair-row">
              <div class="form-col-left">
                <div class="form-group">
                  <label>Fragtfirma:</label>
                  <div class="menu-dd" id="dd_courier"></div>
                </div>
              </div>
              <div class="form-col-right">
                <div class="form-group">
                  <label>Pakkenummer:</label>
                  <input type="text" id="soldEditTracking">
                </div>
              </div>
            </div>

            <!-- RÆKKE 5 -->
            <div class="modal-pair-row">
              <div class="form-col-left">
                <div class="form-group">
                  <label>Betaling:</label>
                  <div class="menu-dd" id="dd_payment"></div>
                </div>
              </div>
              <div class="form-col-right">
                <div class="form-group">
                  <label>Ordrestatus:</label>
                  <div class="menu-dd" id="dd_status"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="doc-upload-grid">
            <div class="doc-col">
              <label>Pakke</label>
              <div class="doc-square">
                <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('docIn_parcel').click()">Edit</button>
                <span style="font-size:9.5px; color:#888;" id="docTxt_parcel">Intet billede</span>
                <img class="doc-thumb" id="docImg_parcel" src="" style="display:none;">
                <input type="file" id="docIn_parcel" accept="image/*" style="display:none;" onchange="handleEditDoc('parcel', this)">
              </div>
            </div>
            <div class="doc-col">
              <label>Pakkelabel</label>
              <div class="doc-square">
                <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('docIn_label').click()">Edit</button>
                <span style="font-size:9.5px; color:#888;" id="docTxt_label">Intet billede</span>
                <img class="doc-thumb" id="docImg_label" src="" style="display:none;">
                <input type="file" id="docIn_label" accept="image/*" style="display:none;" onchange="handleEditDoc('label', this)">
              </div>
            </div>
            <div class="doc-col">
              <label>Kvittering</label>
              <div class="doc-square">
                <button type="button" class="doc-edit-mini-btn" onclick="document.getElementById('docIn_receipt').click()">Edit</button>
                <span style="font-size:9.5px; color:#888;" id="docTxt_receipt">Intet billede</span>
                <img class="doc-thumb" id="docImg_receipt" src="" style="display:none;">
                <input type="file" id="docIn_receipt" accept="image/*" style="display:none;" onchange="handleEditDoc('receipt', this)">
              </div>
            </div>
          </div>

          <div class="modal-bottom-actions">
            <button type="button" class="nav-btn" style="background:#ddd; margin-left:0;" onclick="closeSoldEditModal()">Annuller</button>
            <span id="bundleSyncNotice" style="font-size:10px; color:#666; text-align:center; flex:1; padding:0 10px;"></span>
            <button type="submit" id="soldSaveBtn" class="nav-btn" style="background:#28a745; color:#fff; margin-right:0;">Gem ordre</button>
          </div>
        </form>
      </div>

      <button type="button" class="bundle-nav-arrow hidden" id="nextBundleItemBtn" onclick="navigateBundleItem(1)">&gt;</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWrM7iN9Xwq1TFVDUmq-X8pms3F3kw1suDttXAFovz7yDSKzdCNgf3RtcEa0cJOsy4jg/exec";
    const gImg = (id) => `https://lh3.googleusercontent.com/d/${id}`;

    const EDIT_BUTTON_ID = "1HsyRpwfH7LQ9HBMPOFITVhZ94F_E-5ty";
    const ARROW_ICON_ID = "1F-rxnausU8JDKaz1JLxXWQ3VTemBt0up";
    const TRACKING_ICON_ID = "1AU1QER6wU2TNsHf02oQAvPSP0MX-w_0N";
    const OPEN_MENU_ID = "14oc9MOOR91_fwKhldiuDkXlEYcw2gxMJ";
    const CLOSE_MENU_ID = "1WQydM6EL2vf1aUXxjMMkQMo2ZMQA120S";

    const BUNDLE_COLORS = ["#4594F5", "#0062FF", "#0225A6", "#2A69FA", "#0046EB"];

    const PLATFORM_OPTIONS = [
      { value: "Vinted", showFilterId: "1jQK96GDnU3604ffE0UsHb7go6pGN8kWa", menuId: "1yMRCzETqrMGeyfhGSoHvxUXTM8R0jIEy", bannerId: "14J0W6jbMBtf-hNYarRV22a6-or-YOOwY", userIcon: "1i_bDNOmNgnCr2QnGyfkKlgvNkmD4_otB" },
      { value: "Tradera", showFilterId: "1zRUJZnYBCb-xVyl9QKPZzNMS1lq6Vb4J", menuId: "179AZg76kGE_kPm5eP_GFsK37maY7NNNk", bannerId: "15F4qoQKkC4hRoVs3suWwe2PHMcHE69JT", userIcon: "10uwozjVSczmLIqVorD-FW_II0dFXvDy7" },
      { value: "Tise", showFilterId: "1REhU8lYUSiuKGdRb8p1Zk2aWKgQ1W3jx", menuId: "1Yit3yyaY5SD4pbP-GR0j9lESU7nfDKgO", bannerId: "15-2hBJOQUCHsoQZddFuuFVXNcul6DQxe", userIcon: "1gOp7i9YqCFkpc-UFt3fUEdVKkysiY2gR" },
      { value: "Bought", showFilterId: "1Sa4X7XQUcxypr3s1nE0vysYjYhWdLPMb", menuId: "11UZVm7HE2bP29VC07ZDc1KlsNGsPYoq1", bannerId: "19xWpajyCb8U6T3g_eecOzGyq-mLuJaGe", userIcon: "1Of7OB7zXgqulaAPlenuq7pYn7kJ0OSVF" },
      { value: "DBA", showFilterId: "1S8a0BUXl1IJbBtRxfipNt1SZl5GFLktW", menuId: "1g2xJ9loVRIowfp-LJIm6thFIDkcuJ3N5", bannerId: "1wPXLYQbJ4kbpszi-2PaWqFR1VQuMVW0A", userIcon: "1EwbmPge4W9vL3wU8rHVlvyoqfmHAAG_3" },
      { value: "Marketplace", showFilterId: "1vh_jVBmLh6goVh7ayhLT5Gufpt7lE4Nn", menuId: "155QvvSINFRyhf-y_WeI22NTkbmNg3K7K", bannerId: "1ucrUyA9e98MexzuPDRsz0-VsQGdNh9ku", userIcon: "1Y3TD9H7OExVjC-5VbKuRMD91inJ_0V16" }
    ];

    const COURIER_OPTIONS = [
      { value: "PostNord", menuId: "1w7_jiRBaYINhCGHvvjtPFZlXLDTdpvJu", iconId: "1_G903Gnsuhquelii_dMycBJntgAVwvw3" },
      { value: "DAO", menuId: "1y-NEC_5KOVNVQ347v37nB7mKGMLQnNF0", iconId: "1LHCGtWmKpU13RuEOwI_PyiBFvU8t-BUQ" },
      { value: "GLS", menuId: "1feqthGGiWeUmHolmP-m2SPLHLp8JptKw", iconId: "17fG-O9nnf9gqkukpmXxBP_xpDf6OhxlX" },
      { value: "Bring", menuId: "1LUZasOO0nE1_3BGEJsWmGjNO9BMWqEKk", iconId: "1US6ZbFCfMuGrSXqW2WVbjYzfrrGHZTma" },
      { value: "Instabox", menuId: "1CwuuF7VU3KFFbkvkjI59Yz1YuJN3RPs2", iconId: "1zNLEBgsElDWYq6X0I-W0xaR26rAtv957" },
      { value: "Pickup", menuId: "1im8Drr_3LtMBgmC8WvY57wvAt93JSYyH", iconId: "1xg0vhDpWJMphKTMLMcf_oUSqqc1LUiN_" }

    const DESTINATION_OPTIONS = [
      { value: "Danmark", menuId: "1pmIGY2mb1wG-TY9Lpw0PEjySI9S4Ow9q", iconId: "1F-jObOWtx7K93HgdYuLytJn82ToVUGGl" },
      { value: "Sverige", menuId: "1qVR8UpSWfbCXzZchDy25X3EZnkAaaDc-", iconId: "1bREkOS5VPwFEva6b4fSX1D1Bc3bnDSOm" },
      { value: "Polen", menuId: "1jqPgTw5I12w_6VVjZ5gAeHG2igswsE06", iconId: "1C9WEYr6zoCVMY4D3bUecULt169hH4G-w" },
      { value: "Finland", menuId: "1lDoMLwuKd0UjVx2-b8dQOZ29tLlEfugu", iconId: "1xg1B_DphGHRuiok7Zmf9kie-uM-E121Z" },
      { value: "Tyskland", menuId: "1WgCD0IY9g7Dl7kyXhpVoR-MXJImGIj0B", iconId: "1SpDxgx6oP5nvG8X80YQpzhWYF5pXFcT6" }
    ];

    const PAYMENT_OPTIONS = [
      { value: "Payment pending", menuId: "14lKTkWnas51MSA5JZFA9Q3FAIbjV0zNn", iconId: "14zlIB9tn7QeKmo7LfTkB_dWD53JyHLiP" },
      { value: "Payment received", menuId: "15xRDML4scoyllm7Dk9F2zrhPTu_tL77L", iconId: "1MrbqiUwXUuiUuJe1m4uK-RCa-TpNriny" }
    ];

    const STATUS_OPTIONS = [
      { value: "Ready for shipment", menuId: "18Es6PEnSoW-YqSNIl9qtlL61U91J36ap", iconId: "1rTKuoZXxvAm2q_naFFuBbfh1Ezuftxgj" },
      { value: "Shipped", menuId: "1t60273LIw-XbSvPOS9-QuMP1SzKx1K-7", iconId: "1JGpphly8ioSPQSgV_ifWDatCltRK6ivc" },
      { value: "Ready for pickup", menuId: "1Poq2KYUAFEHn6ozch6xUe96Z7tu8a4rw", iconId: "1avE42VRpS2AhcrkmDhcFCprIe_vTKAXL" },
      { value: "Received", menuId: "1DfI5EK8sDP-xGTSF7MAhh6ReuguJTN08", iconId: "14ao9RWQaF7uvAG9n3f8OmIYW5vcL-3tf" },
      { value: "Returned", menuId: "1nTk57t0lQb8xnZgMHra0Nt5_euSL2blu", iconId: "1h3bejrOF5lFkHyAkGKXLACqRGZhQJw5x" },
      { value: "Suspended", menuId: "1LJpux39GVdRt-Tjq6d7GB-NayTqRsn2q", iconId: "1oqglZwfLJbeG47dCNu_RS-PkVB54j8zS" },
      { value: "Completed", menuId: "1efz1vxjK9xD-il50kRsRQR1ZzoLA_UrT", iconId: "1L0i5--MFRhy8QHm1Z76TGp3yC0UBE5EY" }
    ];

    let allSoldItems = [];
    let activePlatformFilters = new Set(PLATFORM_OPTIONS.map(p => p.value.toLowerCase()));
    let currentBundleItems = [];
    let currentBundleIndex = 0;
    let editModalState = { platform: "Vinted", destination: "Danmark", courier: "PostNord", payment: "Payment received", status: "Completed" };
    let editPendingDocs = { parcel: "", label: "", receipt: "" };

    function togglePlatformDropdown(e) {
      e.stopPropagation();
      document.getElementById('platformDropdownPanel').classList.toggle('show');
    }

    window.addEventListener('click', (e) => {
      if (!e.target.closest('#platformDropdownWrap')) {
        const panel = document.getElementById('platformDropdownPanel');
        if (panel) panel.classList.remove('show');
      }
      if (!e.target.closest('.menu-dd')) {
        document.querySelectorAll('.menu-dd-list').forEach(l => l.classList.remove('open'));
        document.querySelectorAll('.menu-toggle-icon').forEach(i => i.src = gImg(OPEN_MENU_ID));
      }
    });

    function renderPlatformFilterPanel() {
      const container = document.getElementById('platformFilterButtons');
      if (!container) return;
      container.innerHTML = PLATFORM_OPTIONS.map(p => {
        const isOn = activePlatformFilters.has(p.value.toLowerCase());
        return `
          <button type="button" class="filter-plat-btn ${isOn ? '' : 'off'}" title="${p.value}" onclick="togglePlatformFilter('${p.value}')">
            <img src="${gImg(p.showFilterId)}" alt="${p.value}">
          </button>
        `;
      }).join('');
    }

    function togglePlatformFilter(platName) {
      const key = platName.toLowerCase();
      if (activePlatformFilters.has(key)) activePlatformFilters.delete(key);
      else activePlatformFilters.add(key);
      renderPlatformFilterPanel();
      renderSoldGrid(allSoldItems);
    }

    function normalizeDateInput(input) {
      let val = input.value.trim();
      if (!val) return;
      val = val.replace(/[-.]/g, '/');
      if (/^\d{8}$/.test(val)) val = `${val.slice(0,2)}/${val.slice(2,4)}/${val.slice(4)}`;
      let parts = val.split('/');
      if (parts.length === 3) {
        let d = parts[0].padStart(2, '0');
        let m = parts[1].padStart(2, '0');
        let y = parts[2];
        if (y.length === 2) y = '20' + y;
        input.value = `${d}/${m}/${y}`;
      }
    }

    function openDatePicker(inputId) {
      const picker = document.getElementById(inputId + 'HiddenPicker');
      if (picker) typeof picker.showPicker === 'function' ? picker.showPicker() : picker.click();
    }

    function onDatePicked(inputId, picker) {
      if (!picker.value) return;
      let parts = picker.value.split('-');
      if (parts.length === 3) document.getElementById(inputId).value = `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatDanishDate(raw) {
      if (!raw) return "";
      let str = String(raw).trim();
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return str;
      let d = new Date(str);
      if (!isNaN(d.getTime())) return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
      return str;
    }

    function formatDanishPrice(raw) {
      if (raw === null || raw === undefined || raw === "") return "0,00 kr.";
      let cleaned = String(raw).replace(/kr\.?/gi, "").trim();
      if (cleaned.includes(",") && cleaned.includes(".")) cleaned = cleaned.replace(/\./g, "").replace(",", ".");
      else if (cleaned.includes(",")) cleaned = cleaned.replace(",", ".");
      let num = parseFloat(cleaned);
      if (isNaN(num)) return cleaned ? `${cleaned} kr.` : "0,00 kr.";
      return `${num.toFixed(2).replace(".", ",")} kr.`;
    }

    async function loadSoldItems() {
      renderPlatformFilterPanel();
      try {
        const res = await fetch(SCRIPT_URL + "?action=sold", { redirect: "follow" });
        const text = await res.text();
        allSoldItems = JSON.parse(text);
        renderSoldGrid(allSoldItems);
      } catch (err) {
        document.getElementById('soldContainer').innerHTML = '<p>Fejl ved indlæsning: ' + err.message + '</p>';
      }
    }

    function renderSoldGrid(items) {
      const container = document.getElementById('soldContainer');
      if (!items || items.length === 0) {
        container.innerHTML = '<p>Ingen solgte varer fundet.</p>';
        return;
      }

      const orderCounts = {};
      items.forEach(i => { if (i.order_id) orderCounts[i.order_id] = (orderCounts[i.order_id] || 0) + 1; });

      const reversed = items.slice().reverse();
      const bundleColorMap = {};
      let colorIdx = 0;
      reversed.forEach(i => {
        if (orderCounts[i.order_id] > 1 && !bundleColorMap[i.order_id]) {
          bundleColorMap[i.order_id] = BUNDLE_COLORS[colorIdx % BUNDLE_COLORS.length];
          colorIdx++;
        }
      });

      const visibleItems = reversed.filter(item => activePlatformFilters.has(String(item.platform || 'Vinted').toLowerCase()));

      if (visibleItems.length === 0) {
        container.innerHTML = '<p>Ingen varer matcher de valgte platforme.</p>';
        return;
      }

      container.innerHTML = visibleItems.map((item) => {
        const isBundle = orderCounts[item.order_id] > 1;
        const platObj = PLATFORM_OPTIONS.find(p => p.value.toLowerCase() === String(item.platform || '').toLowerCase()) || PLATFORM_OPTIONS[0];
        const courierObj = COURIER_OPTIONS.find(c => c.value.toLowerCase() === String(item.courier || '').toLowerCase());
        const destObj = DESTINATION_OPTIONS.find(d => d.value.toLowerCase() === String(item.destination || '').toLowerCase());
        const payObj = PAYMENT_OPTIONS.find(p => p.value.toLowerCase() === String(item.payment_status || '').toLowerCase()) || PAYMENT_OPTIONS[1];
        const statObj = STATUS_OPTIONS.find(s => s.value.toLowerCase() === String(item.order_status || '').toLowerCase() || (s.value === 'Completed' && String(item.order_status || '').toLowerCase() === 'complete')) || STATUS_OPTIONS[6];
        const origRevIdx = reversed.indexOf(item);

        return `
          <div class="item-card">
            <div class="image-container">
              <button class="corner-edit-btn" title="Rediger ordre" onclick="openSoldEditModal(${origRevIdx})">
                <img src="${gImg(EDIT_BUTTON_ID)}" alt="Rediger">
              </button>
              ${item.image_id ? `<img src="${gImg(item.image_id)}" alt="${item.title}">` : '<div style="color:#777; text-align:center; padding-top:100px;">Mangler</div>'}
              <div class="order-overlay-label ${isBundle ? 'is-bundle' : ''}" style="${isBundle ? `background:${bundleColorMap[item.order_id]};` : ''}">
                ORDRE #${item.order_id}
              </div>
            </div>

            <div class="platform-banner">
              <img src="${gImg(platObj.bannerId)}" alt="${platObj.value}">
            </div>

            <div class="info-box">
              <div>
                <div class="info-title">${item.title || ''}</div>
                <div class="date-price-row" style="margin-top:5px;">
                  <span class="sale-date-text">${formatDanishDate(item.date)}</span>
                  <span class="sale-price-text">${formatDanishPrice(item.price)}</span>
                </div>
                <div class="buyer-info-block">
                  <div class="icon-text-row">
                    <img class="mini-icon" src="${gImg(platObj.userIcon)}" alt="">
                    <span class="buyer-username-text">${item.username || '-'}</span>
                  </div>
                  <div class="icon-text-row">
                    <img class="mini-icon" src="https://lh3.googleusercontent.com/d/1re723daIGL0sxmLhcuxDMR20ZM7-gCWY" alt="">
                    <span class="buyer-name-text">${item.name || '-'}</span>
                  </div>
                </div>
              </div>

              <div>
                <div class="shipping-route-row">
                  <div class="shipping-badge-wrap">
                    ${courierObj ? `<img src="${gImg(courierObj.iconId)}" alt="">` : `<span>${item.courier || ''}</span>`}
                  </div>
                  <img class="arrow-sep-img" src="${gImg(ARROW_ICON_ID)}" alt="">
                  <div class="shipping-badge-wrap">
                    ${destObj ? `<img src="${gImg(destObj.iconId)}" alt="">` : `<span>${item.destination || ''}</span>`}
                  </div>
                </div>
                <div class="tracking-row">
                  <button class="tracking-btn"><img src="${gImg(TRACKING_ICON_ID)}" alt=""></button>
                  <span class="tracking-text">${item.tracking || '-'}</span>
                </div>
                <div class="bottom-status-row">
                  <div class="pay-badge-wrap"><img src="${gImg(payObj.iconId)}" alt=""></div>
                  <div class="stat-badge-wrap"><img src="${gImg(statObj.iconId)}" alt=""></div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openSoldEditModal(revIdx) {
      const reversed = allSoldItems.slice().reverse();
      const clicked = reversed[revIdx];
      if (!clicked) return;

      currentBundleItems = reversed.filter(i => String(i.order_id) === String(clicked.order_id));
      currentBundleIndex = currentBundleItems.findIndex(i => i === clicked);
      if (currentBundleIndex < 0) currentBundleIndex = 0;

      editPendingDocs = { parcel: "", label: "", receipt: "" };
      populateEditModal();
      document.getElementById('soldEditModal').classList.add('show');
    }

    function closeSoldEditModal() {
      document.getElementById('soldEditModal').classList.remove('show');
    }

    function populateEditModal() {
      const item = currentBundleItems[currentBundleIndex];
      if (!item) return;

      const isBundle = currentBundleItems.length > 1;
      const prevBtn = document.getElementById('prevBundleItemBtn');
      const nextBtn = document.getElementById('nextBundleItemBtn');

      if (isBundle) {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        document.getElementById('soldModalOrderMeta').innerText = `ORDRE #${item.order_id} • Vare ${currentBundleIndex + 1} af ${currentBundleItems.length} i bundle`;
        document.getElementById('bundleSyncNotice').innerText = "Ordre-data synkroniseres på hele bundle.";
      } else {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        document.getElementById('soldModalOrderMeta').innerText = `ORDRE #${item.order_id}`;
        document.getElementById('bundleSyncNotice').innerText = "";
      }

      document.getElementById('soldModalItemTitle').innerText = item.title || '';
      document.getElementById('soldModalItemImg').src = item.image_id ? gImg(item.image_id) : '';

      document.getElementById('soldEditDate').value = formatDanishDate(item.date);
      document.getElementById('soldEditPrice').value = formatDanishPrice(item.price);
      document.getElementById('soldEditUsername').value = item.username || '';
      document.getElementById('soldEditName').value = item.name || '';
      document.getElementById('soldEditTracking').value = item.tracking || '';

      let total = 0;
      currentBundleItems.forEach(i => {
        let clean = String(i.price || "0").replace(/kr\.?/gi, "").replace(/\./g, "").replace(",", ".").trim();
        let num = parseFloat(clean);
        if (!isNaN(num)) total += num;
      });
      document.getElementById('soldEditOrderTotal').value = `= ${total.toFixed(2).replace(".", ",")} kr.`;

      const normStatus = (String(item.order_status || '').toLowerCase() === 'complete') ? 'Completed' : (item.order_status || 'Completed');

      renderEditDropdown('dd_platform', 'platform', PLATFORM_OPTIONS, item.platform || 'Vinted', onEditPlatformChange);
      renderEditDropdown('dd_destination', 'destination', DESTINATION_OPTIONS, item.destination || 'Danmark');
      renderEditDropdown('dd_courier', 'courier', COURIER_OPTIONS, item.courier || 'PostNord');
      renderEditDropdown('dd_payment', 'payment', PAYMENT_OPTIONS, item.payment_status || 'Payment received');
      renderEditDropdown('dd_status', 'status', STATUS_OPTIONS, normStatus);

      setEditDocPreview('parcel', editPendingDocs.parcel || (item.parcel_id ? gImg(item.parcel_id) : ''));
      setEditDocPreview('label', editPendingDocs.label || (item.label_id ? gImg(item.label_id) : ''));
      setEditDocPreview('receipt', editPendingDocs.receipt || (item.receipt_id ? gImg(item.receipt_id) : ''));
    }

    function renderEditDropdown(containerId, key, options, selectedVal, cb) {
      const container = document.getElementById(containerId);
      const selObj = options.find(o => o.value.toLowerCase() === String(selectedVal).toLowerCase()) || options[0];
      editModalState[key] = selObj.value;

      container.innerHTML = `
        <div class="menu-dd-btn" onclick="toggleEditDropdown(event, '${containerId}')">
          <img class="menu-img" src="${gImg(selObj.menuId)}" alt="${selObj.value}">
          <img class="menu-toggle-icon" src="${gImg(OPEN_MENU_ID)}" alt="">
        </div>
        <div class="menu-dd-list">
          ${options.map(opt => `
            <div class="menu-dd-opt" onclick="selectEditOption('${containerId}', '${key}', '${opt.value}')">
              <img class="menu-img" src="${gImg(opt.menuId)}" alt="${opt.value}">
            </div>
          `).join('')}
        </div>
      `;
      if (cb) cb(selObj.value);
    }

    function toggleEditDropdown(e, containerId) {
      e.stopPropagation();
      document.querySelectorAll('.menu-dd-list').forEach(l => {
        if (l.parentElement.id !== containerId) {
          l.classList.remove('open');
          const ic = l.parentElement.querySelector('.menu-toggle-icon');
          if (ic) ic.src = gImg(OPEN_MENU_ID);
        }
      });
      const list = document.querySelector(`#${containerId} .menu-dd-list`);
      const icon = document.querySelector(`#${containerId} .menu-toggle-icon`);
      list.classList.toggle('open');
      if (icon) icon.src = list.classList.contains('open') ? gImg(CLOSE_MENU_ID) : gImg(OPEN_MENU_ID);
    }

    function selectEditOption(containerId, key, val) {
      editModalState[key] = val;
      const map = { platform: PLATFORM_OPTIONS, destination: DESTINATION_OPTIONS, courier: COURIER_OPTIONS, payment: PAYMENT_OPTIONS, status: STATUS_OPTIONS };
      renderEditDropdown(containerId, key, map[key], val, key === 'platform' ? onEditPlatformChange : null);
    }

    function onEditPlatformChange(val) { editModalState.platform = val; }

    function navigateBundleItem(step) {
      saveCurrentEditItem();
      const next = currentBundleIndex + step;
      if (next >= 0 && next < currentBundleItems.length) {
        currentBundleIndex = next;
        populateEditModal();
      }
    }

    function saveCurrentEditItem() {
      const item = currentBundleItems[currentBundleIndex];
      if (!item) return;
      item.price = formatDanishPrice(document.getElementById('soldEditPrice').value);
      const shared = {
        date: formatDanishDate(document.getElementById('soldEditDate').value),
        platform: editModalState.platform,
        destination: editModalState.destination,
        username: document.getElementById('soldEditUsername').value,
        name: document.getElementById('soldEditName').value,
        courier: editModalState.courier,
        tracking: document.getElementById('soldEditTracking').value,
        payment_status: editModalState.payment,
        order_status: editModalState.status
      };
      currentBundleItems.forEach(i => Object.assign(i, shared));
    }

    function formatPriceFieldOnBlur() {
      const inp = document.getElementById('soldEditPrice');
      inp.value = formatDanishPrice(inp.value);
    }

    function setEditDocPreview(type, url) {
      const img = document.getElementById(`docImg_${type}`);
      const txt = document.getElementById(`docTxt_${type}`);
      if (url) { img.src = url; img.style.display = 'block'; txt.style.display = 'none'; }
      else { img.src = ''; img.style.display = 'none'; txt.style.display = 'block'; }
    }

    function handleEditDoc(type, input) {
      if (!input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = () => { editPendingDocs[type] = reader.result; setEditDocPreview(type, reader.result); };
      reader.readAsDataURL(input.files[0]);
    }

    async function handleSoldEditSave(e) {
      e.preventDefault();
      saveCurrentEditItem();

      const primary = currentBundleItems[0];
      const payload = {
        action: "updateSoldOrder",
        order_id: primary.order_id,
        shared: {
          date: primary.date,
          platform: primary.platform,
          destination: primary.destination,
          username: primary.username,
          name: primary.name,
          courier: primary.courier,
          tracking: primary.tracking,
          payment_status: primary.payment_status,
          order_status: primary.order_status
        },
        items: currentBundleItems.map(i => ({ sold_id: i.sold_id, active_id: i.active_id, price: formatDanishPrice(i.price) })),
        parcelBase64: editPendingDocs.parcel,
        labelBase64: editPendingDocs.label,
        receiptBase64: editPendingDocs.receipt
      };

      const btn = document.getElementById('soldSaveBtn');
      btn.disabled = true;
      btn.innerText = 'Gemmer...';

      try {
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        closeSoldEditModal();
        loadSoldItems();
      } catch (err) {
        alert("Fejl ved gem: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Gem ordre';
      }
    }

    window.onload = loadSoldItems;
  </script>
